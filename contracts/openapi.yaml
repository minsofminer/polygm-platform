        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - addressId
              properties:
                addressId:
                  type: string
                  minLength: 4
                  maxLength: 64
                code:
                  type: string
                  pattern: ^[0-9]{6}$
      responses:
        '200':
          description: see the summary; every field is derived from a row, no token material
        '401':
          description: no bearer session, or the session ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: the session is fine; the action needs more
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: the destination is inside its 24 hour hold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: the body is not the shape this route takes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: too many attempts against this credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: the global handler answered with the envelope and a request id; nothing in this route may answer
            outside that envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: the security backend is not configured here
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/admin/revoke-sessions:
    post:
      tags:
      - admin
      summary: 'Break-glass: end every session, one statement, two named approvers'
      description: 'Two distinct approvers and a reason of at least twenty characters, validated by the same function
        the P06 kill drill uses. The single most dangerous account in this product is the one that can log everybody
        out, because that is what an attacker does to stop you from seeing what they did — so the path exists, it
        is loud, and every use of it is an event. '
      operationId: adminRevokeSessions
      x-auth: admin
      x-rate-class: admin
      x-cache: no-store
      x-idempotency-exempt: revocation converges to zero live sessions; the audit rows for each call are the point
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - reason
              - approvers
              properties:
                reason:
                  type: string
                  minLength: 4
                  maxLength: 400
                approvers:
                  type: array
                  minItems: 2
                  items:
                    type: string
                    minLength: 2
                scope:
                  type: string
                  enum:
                  - user
                  - all
                userId:
                  type: string
                  maxLength: 64
      responses:
        '200':
          description: see the summary; every field is derived from a row, no token material
        '403':
          description: the session is fine; the action needs more
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: the body is not the shape this route takes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: the global handler answered with the envelope and a request id; nothing in this route may answer
            outside that envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: the security backend is not configured here
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/tape/fills:
    get:
      tags: [market]
      summary: The market-wide tape, filterable (P10 D2)
      description: |
        Every fill we hold, newest first, across all markets. `/v1/tape` is per-market and reads the P04
        fixture; this reads the durable `tape_fills` log and is the only tape the terminal uses.

        Filtering happens SERVER-side for three reasons that each bit during the design pass: a filter applied
        after a `LIMIT` silently hides matches; the relative whale threshold needs the same window the rows
        came from; and the count behind a filter is a fact the client cannot compute. The response therefore
        carries `filterNote` saying the counts are of the page while `/v1/tape/facets` has the window's totals.
      operationId: getTapeFills
      x-auth: none
      x-rate-class: public-read
      x-cache: private, no-store for authed, 500ms shared
      parameters:
        - name: marketId
          in: query
          schema: {type: string}
          description: when present, only this market's fills; the market must exist (404 otherwise)
        - name: since
          in: query
          description: exclusive cursor = the VENUE's clock (`ts_ms`). Mixing it with our ingest clock produces
            a duplicate or a hole, and a hole in a tape reads as a suppressed trade.
          schema: {type: integer, minimum: 0}
        - name: windowMs
          in: query
          description: >-
            how far back the response (and the whale threshold it ships) reaches. Capped at 24h: the threshold
            is computed from a bounded in-process sample, and a bound that is not enforced is a bound that
            becomes a table scan the first time somebody asks for 30 days.
          schema: {type: integer, minimum: 1, maximum: 86400000, default: 3600000}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 64}
        - name: side
          in: query
          schema: {type: string, enum: [BUY, SELL]}
        - name: outcome
          in: query
          schema: {type: string}
        - name: category
          in: query
          schema: {type: string}
        - name: label
          in: query
          description: only fills whose wallet carries this PUBLISHABLE label; an unpublishable one matches nothing
          schema: {type: string, enum: [whale, smart_money, new_wallet, cluster, wash_like]}
        - name: wallet
          in: query
          description: a pseudonym from `anonWallet`, never an address. An unknown value is a 404 rather than an
            empty page, because "no fills" and "no such trader" are different answers.
          schema: {type: string}
        - name: minNotionalMicro
          in: query
          description: absolute floor in micro-USDC (D2's absolute filter, alongside the relative whale rule)
          schema: {type: integer, minimum: 0}
      responses:
        "200":
          description: fills, newest first, each carrying the whale threshold it was judged against
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [rows, counts, windowMs, filterNote]
                    properties:
                      rows:
                        type: array
                        maxItems: 500
                        items: {$ref: "#/components/schemas/TerminalFill"}
                      counts: {$ref: "#/components/schemas/TapeCounts"}
                      windowMs: {type: integer}
                      nextCursor: {type: ["integer", "null"], description: "exclusive venue-clock cursor"}
                      filterNote: {type: string}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}

        "500": {$ref: "#/components/responses/Internal"}
  /v1/tape/facets:
    get:
      tags: [market]
      summary: What is in the window, and every filter's options with counts (P10 D2/D4)
      description: |
        The data behind the filter bar. Served as one payload because a filter bar assembled from six requests
        is a filter bar that shows six different windows, and the faceted counts are what make a filter honest:
        a user picking "whale" should see how many exist before picking it.

        This is also where the whale threshold is DEFINED for a window, so a screen can state the rule before
        the first fill arrives. Every classification label comes with its rule and its disclaimer - a badge
        whose rule is not visible is an accusation.
      operationId: getTapeFacets
      x-auth: none
      x-rate-class: public-read
      x-cache: shared, 1s
      parameters:
        - name: marketId
          in: query
          schema: {type: string}
        - name: windowMs
          in: query
          schema: {type: integer, minimum: 1, maximum: 86400000, default: 3600000}
      responses:
        "200":
          description: the window's distribution, its thresholds and its facets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - $ref: "#/components/schemas/TapeFacets"
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}

        "500": {$ref: "#/components/responses/Internal"}
  /v1/whales:
    get:
      tags: [market]
      summary: The whale feed - the same rule as the tape, applied per market (P10 D4)
      description: |
        Every fill at or above ITS OWN market's threshold, sorted by notional. The threshold is per market and
        the rule travels with the response (`thresholds`) so a global feed cannot imply a global rule: $5,000 is
        a whale in one market and the median fill in another, and a feed that hides which one it used cannot be
        tuned.

        `multiple` switches the relative term to N x the market's median fill - the tunable form a saved view
        exposes - and the absolute floor applies either way. `reason` per market says which term won, which is
        the difference between a threshold a user can reproduce and a number they have to trust.
      operationId: getWhales
      x-auth: none
      x-rate-class: public-read
      x-cache: shared, 1s
      parameters:
        - name: marketId
          in: query
          description: per-market mode; absent means the global feed
          schema: {type: string}
        - name: windowMs
          in: query
          schema: {type: integer, minimum: 1, maximum: 86400000, default: 3600000}
        - name: multiple
          in: query
          description: relative term as a whole multiple of the market's median fill (20 = 20x). Bounded,
            because "10,000x the median" is a filter that can never match and a control that cannot match
            anything is a broken control.
          schema: {type: integer, minimum: 2, maximum: 1000}
        - name: minSeverity
          in: query
          schema: {type: string, enum: [info, notice, urgent], default: info}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        "200":
          description: the feed and the rule it was computed with
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - $ref: "#/components/schemas/WhaleFeed"
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}

        "500": {$ref: "#/components/responses/Internal"}
  /v1/traders/{anon}:
    get:
      tags: [market]
      summary: A trader's dossier, by pseudonym (P10 D3)
      description: |
        One wallet: four windows of the SAME metric set, the PnL curve with its drawdown per point, the
        positions still open, the behaviour labels with their rules, and the methodology for every number.

        Two rules are structural rather than decorative: a win rate below the sample gate is `null` WITH A
        REASON (never a percentage - a 3-for-4 record is not a 75% win rate), and every curve point carries
        `peakMicro` and `drawdownMicro`, so no chart can draw PnL without the overlay. Both are computed in
        `polygm_core.terminal.metrics`, so a client cannot opt out of either.

        The header carries the pseudonym and never an address: `/v1/tape/fills` names traders the same way, and
        a screen that resolved one to an address would make the other pointless.
      operationId: getTrader
      x-auth: none
      x-rate-class: public-read
      x-cache: shared, 5s
      parameters:
        - name: anon
          in: path
          required: true
          schema: {type: string}
        - name: window
          in: query
          description: which window `curve`, `positions` and `breakdown` describe; all four metrics always ship
          schema: {type: string, enum: [7d, 30d, 90d, all], default: 30d}
      responses:
        "200":
          description: the dossier
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - $ref: "#/components/schemas/TraderDossier"
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}

        "500": {$ref: "#/components/responses/Internal"}
  /v1/copy/sources:
    get:
      tags: [trading]
      summary: Copyable sources, ranked risk-adjusted by default (P10 D7)
      description: |
        D7's discovery list. The default sort is `riskAdjusted` - net after fees per unit of drawdown - and the
        payload states it in `sortNote` and `ranking`, because a list that does not say how it is ordered
        implies the obvious order, and the obvious order is raw PnL, which surfaces lucky gamblers.

        Every row carries the two numbers that make the ratio checkable: `maxDrawdownMicro` (the denominator) and
        `riskAdjustedRule` (the division, spelled out). `winRateBps` is `null` with `sampleNote` when the source
        is below `sampleGate` settled trades - a rate below the gate is not a low-confidence rate, it is not a
        rate. `netAfterFeesMicro` is returned as it is, negative included.
      operationId: listCopySources
      x-auth: user
      x-rate-class: authed-read
      x-cache: no-store
      parameters:
        - name: windowDays
          in: query
          schema: {type: integer, minimum: 7, maximum: 90, default: 30}
        - name: sort
          in: query
          schema: {type: string, default: riskAdjusted, enum: [riskAdjusted, netAfterFees, closedTrades, drawdown]}
        - name: onlyCopying
          in: query
          schema: {type: boolean, default: false}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200":
          description: ranked sources, each with its drawdown, its gate and its losing windows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [rows, count, windowDays, sort, sorts, sortNote, ranking, sampleGate, emptyNote, note]
                    properties:
                      rows:
                        type: array
                        items: {$ref: "#/components/schemas/CopySource"}
                      count: {type: integer}
                      windowDays: {type: integer}
                      sort: {type: string}
                      sorts: {type: array, items: {type: string}}
                      sortNote: {type: string}
                      ranking: {type: string}
                      sampleGate: {type: integer}
                      emptyNote: {type: string}
                      note: {type: string}
        "401": {$ref: "#/components/responses/Denied"}
        "422": {$ref: "#/components/responses/Validation"}
        "500": {$ref: "#/components/responses/Internal"}
  /v1/automations:
    get:
      tags: [trading]
      summary: Automation rules with their derived status, the halt state and the builder's vocabulary (P10 D8)
      description: |-
        `status` is derived rather than stored: it is a function of the rule's `enabled` flag, the engine's
        `paused_reason`, whether a dry run has completed, and whether the risk service has stopped this account —
        and a stored copy of it is a fifth field that can disagree with the four that decide.

        `halt` is the daily-loss halt when it is unacknowledged, and every rule reads `halted` while it is set,
        even a rule that is still `enabled`. That is the one state D8 asks to be loud about.

        `vocabulary` is the engine's own trigger and action kinds, with the limits it enforces (8 leaves, 60s
        minimum interval). A builder that offers a row the engine refuses would save rules that can never fire.
      operationId: listAutomations
      x-auth: user
      x-rate-class: authed-read
      x-cache: no-store
      responses:
        "200":
          description: this account's rules, the halt state, and the builder's vocabulary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - $ref: "#/components/schemas/AutomationList"
        "401": {$ref: "#/components/responses/Denied"}
        "500": {$ref: "#/components/responses/Internal"}
    post:
      tags: [trading]
      summary: Save an automation rule from the builder's rows - ALWAYS a dry run (P10 D8)
      description: |-
        There is no field that arms a rule, exactly as there is no field that turns copy trading live. The rows
        are literals (a price, a level, a duration) joined by `AND`/`OR`; there is no expression syntax, and the
        engine's own validator is the authority on whether the compiled document may exist — an unknown field is
        a 422 naming it, not a rule that fails later at fire time.

        Arming is a separate call that refuses until a dry run has actually been observed.
      operationId: createAutomation
      x-auth: user
      x-rate-class: authed-write
      x-cache: no-store
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, triggers, actions, targets]
              properties:
                kind: {type: string, enum: [entry, exit, cancel, alert, scale_out, hedge, take_profit, stop_loss,
                                            auto_redeem]}
                name: {type: string, maxLength: 80, description: "the user's own label; the engine never reads it"}
                match: {type: string, enum: [all, any], description: "AND or OR across the trigger rows"}
                triggers:
                  type: array
                  minItems: 1
                  description: "rows of {kind, ...fields}; a row may be a group of {group, rows}"
                actions: {type: array, minItems: 1, description: "the engine executes the first executable row"}
                targets:
                  type: array
                  minItems: 1
                  description: "markets to watch; the engine evaluates a rule once per target"
                maxPerDay: {type: integer, minimum: 1, maximum: 288}
                minIntervalMs: {type: integer, minimum: 1000}
                humanPriorityMs: {type: integer, minimum: 0}
                maxLossMicro: {type: integer, minimum: 0}
      responses:
        "200":
          description: the saved rule, in dry-run state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [rule, dryRunOnly, note]
                    properties:
                      rule: {$ref: "#/components/schemas/AutomationRule"}
                      dryRunOnly: {type: boolean}
                      note: {type: string}
        "400": {$ref: "#/components/responses/Validation"}
        "401": {$ref: "#/components/responses/Denied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Validation"}
        "500": {$ref: "#/components/responses/Internal"}
  /v1/automations/runs:
    get:
      tags: [trading]
      summary: Every evaluation of a rule, with the reason it acted or did not (P10 D8)
      description: |-
        "Why did the bot do that" is answered here and nowhere else, so every evaluation is a row — including the
        ones that did nothing. `sentence` is the engine's own reason with a next step where one exists, and
        `leaves` names the parts of the trigger that were true when it was read: the engine evaluates every leaf
        eagerly rather than short-circuiting precisely so a skip can be explained with the whole picture.
      operationId: listAutomationRuns
      x-auth: user
      x-rate-class: authed-read
      x-cache: no-store
      parameters:
        - {name: ruleId, in: query, required: false, schema: {type: string, maxLength: 64}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: run rows, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [rows, counts, note]
                    properties:
                      rows:
                        type: array
                        items: {$ref: "#/components/schemas/AutomationRunRow"}
                      counts: {type: object}
                      note: {type: string}
        "401": {$ref: "#/components/responses/Denied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/Internal"}
  /v1/automations/templates:
    get:
      tags: [trading]
      summary: The rule templates, with the fee arithmetic that can withhold one (P10 D8)
      description: |-
        The 5-minute crypto entry template ships only if its fee arithmetic clears at current fees, and when it
        does not, it is still LISTED with `available: false` and the numbers that withheld it. Hiding it would
        leave a user guessing whether the feature is missing or the maths said no, and the second is worth
        reading.

        The protective half — exit before resolution, size cap, cancel on a one-sided book, the loss alert —
        ships unconditionally, because it can only reduce a loss the user was already risking and its value does
        not depend on any fee measurement.

        `edgeAvailableBp` is a measurement, so it defaults to ABSENT: with no measured edge no entry template can
        be offered, and the response says so rather than inventing a flattering number.
      operationId: listAutomationTemplates
      x-auth: user
      x-rate-class: authed-read
      x-cache: no-store
      parameters:
        - {name: feeType, in: query, required: false, schema: {type: string, default: taker}}
        - {name: feeRateBps, in: query, required: false, schema: {type: integer, minimum: 0, maximum: 10000,
                                                                   default: 200}}
        - {name: edgeAvailableBp, in: query, required: false, schema: {type: integer, minimum: 0, maximum: 10000}}
        - {name: latencyMs, in: query, required: false, schema: {type: integer, minimum: 0, maximum: 600000}}
      responses:
        "200":
          description: the catalog, the arithmetic, and whether the entry half ships
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - $ref: "#/components/schemas/TemplateCatalog"
        "401": {$ref: "#/components/responses/Denied"}
        "500": {$ref: "#/components/responses/Internal"}
  /v1/automations/preview:
    post:
      tags: [trading]
      summary: Dry-run a rule against live facts - the only door to arming it (P10 D8)
      description: |-
        Two callers, one path. With `ruleId` this is a saved rule's dry run: the evaluation is written to
        `automation_runs`, and the first one completes the rule's dry run, which is the only thing that lets it
        arm. Without `ruleId` the builder's rows are compiled and evaluated and NOTHING is saved — the "show me
        what this would have done" step has to work before the rule exists.

        The facts are the engine's own (`automation.facts`), read from our tables: a preview that fed a rule
        different numbers than the live pass would be a preview of a different rule.
      operationId: previewAutomation
      x-auth: user
      x-rate-class: authed-write
      x-cache: no-store
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ruleId: {type: string, maxLength: 64}
                kind: {type: string}
                match: {type: string, enum: [all, any]}
                triggers: {type: array}
                actions: {type: array}
                targets: {type: array}
                maxLossMicro: {type: integer, minimum: 0}
      responses:
        "200":
          description: the simulation, leaf by leaf, and the facts it read
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [dryRun, simulation, note]
                    properties:
                      dryRun: {type: boolean}
                      simulation: {type: object, description: "fires, leaves, and the sentence naming each leaf"}
                      facts: {type: object, description: "what the trigger read: prices, age, imbalance, position"}
                      dryRunCompleted: {type: boolean}
                      rule: {$ref: "#/components/schemas/AutomationRule"}
                      note: {type: string}
        "400": {$ref: "#/components/responses/Validation"}
        "401": {$ref: "#/components/responses/Denied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
        "500": {$ref: "#/components/responses/Internal"}
  /v1/automations/guards:
    post:
      tags: [trading]
      summary: Arm or pause a rule - arming needs a completed dry run (P10 D8)
      description: |-
        Pausing is always allowed and takes effect immediately: the safe direction must never be blocked by a
        precondition. Arming refuses twice over — `DRY_RUN_REQUIRED` until a dry run has been observed, and
        `HALTED` while the daily-loss halt stands — and each refusal names the next step, because a user meets a
        refusal like this while they can still act on it.
      operationId: setAutomationState
      x-auth: user
      x-rate-class: authed-write
      x-cache: no-store
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ruleId, state]
              properties:
                ruleId: {type: string, minLength: 1, maxLength: 64}
                state: {type: string, enum: [active, paused]}
                reason: {type: string, maxLength: 200, description: "why YOU paused it; recorded in the run log"}
      responses:
        "200":
          description: the rule in its new state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [rule, state, note]
                    properties:
                      rule: {$ref: "#/components/schemas/AutomationRule"}
                      state: {type: string, enum: [active, paused]}
                      note: {type: string}
        "400": {$ref: "#/components/responses/Validation"}
        "401": {$ref: "#/components/responses/Denied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Validation"}
        "500": {$ref: "#/components/responses/Internal"}
  /v1/alerts:
    get:
      tags: [trading]
      summary: Alert rules with their window budget, cooldown and what they would do right now (P10 D9)
      description: |-
        The cooldown is not a separate setting: `firesPerWindow` per `windowMs` *is* one fire per
        `windowMs/firesPerWindow`, and `cooldownRule` states that arithmetic in words so a user can check it.

        `wouldDoNow` is the honest part — the plan for this rule at this instant: sent now, held for quiet hours,
        batched into the digest, held by the rule's own cap, or refused because the plan does not cover the
        channel. A list that showed "on" while quiet hours were holding everything is a list that gets called
        broken at 2am.
      operationId: listAlerts
      x-auth: user
      x-rate-class: authed-read
      x-cache: no-store
      responses:
        "200":
          description: this account's alert rules and its notification settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - $ref: "#/components/schemas/AlertsList"
        "401": {$ref: "#/components/responses/Denied"}
        "500": {$ref: "#/components/responses/Internal"}
    post:
      tags: [trading]
      summary: Create or edit one alert rule inline (P10 D9)
      description: |-
        The channel's plan is checked at SAVE time, not at fire time: a free account holding a webhook rule is a
        rule that can never deliver, and finding that out when the alert was supposed to arrive is worse than a
        402 that names the plan now. `ruleId` edits in place; without it a new rule is created.

        Telegram is the default channel; email and webhook are the paid ones.
      operationId: upsertAlert
      x-auth: user
      x-rate-class: authed-write
      x-cache: no-store
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind]
              properties:
                ruleId: {type: string, maxLength: 64}
                kind: {type: string, enum: [price_level, spread_widen, whale_fill, resolve_lead, illiquid_top,
                                            new_market, manual]}
                marketId: {type: string, maxLength: 64}
                eventId: {type: string, maxLength: 64}
                channel: {type: string, enum: [telegram, email, webhook]}
                severity: {type: string, enum: [info, notice, urgent]}
                firesPerWindow: {type: integer, minimum: 1, maximum: 24}
                windowMs: {type: integer, minimum: 60000}
                params: {type: object}
                enabled: {type: boolean}
      responses:
        "200":
          description: the rule as saved, with its cooldown stated as a rule
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [rule, action, note]
                    properties:
                      rule: {$ref: "#/components/schemas/AlertRule"}
                      action: {type: string, enum: [created, updated]}
                      note: {type: string}
        "400": {$ref: "#/components/responses/Validation"}
        "401": {$ref: "#/components/responses/Denied"}
        "402": {$ref: "#/components/responses/Denied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
        "500": {$ref: "#/components/responses/Internal"}
  /v1/alerts/test:
    post:
      tags: [trading]
      summary: Fire a rule on purpose and record what WOULD happen (P10 D9)
      description: |-
        The test writes its own signal under a `test:` rule id, so the rule's real window, cooldown and delivery
        history are untouched: a test that consumed the budget it is testing would poison the feature it
        validates. What comes back is the plan — sent now, held for quiet hours, batched into the digest, or
        refused by the plan — plus the `alert_deliveries` rows that record it.

        No delivery transport runs in this build, so a `queued` row is the record of what would be sent, and the
        response says so in `note` rather than implying a notification went out.
      operationId: testAlert
      x-auth: user
      x-rate-class: authed-write
      x-cache: no-store
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ruleId]
              properties:
                ruleId: {type: string, minLength: 1, maxLength: 64}
                channels: {type: array, description: "defaults to the rule's own channel"}
                title: {type: string, maxLength: 160}
      responses:
        "200":
          description: the per-channel plan for this alert, right now
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [ruleId, plan, summary, note]
                    properties:
                      ruleId: {type: string}
                      testSignalId: {type: integer}
                      plan:
                        type: array
                        items: {$ref: "#/components/schemas/AlertPlan"}
                      summary: {type: object}
                      quietHours: {type: object}
                      digest: {type: object}
                      note: {type: string}
        "400": {$ref: "#/components/responses/Validation"}
        "401": {$ref: "#/components/responses/Denied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/Internal"}
  /v1/alerts/deliveries:
    get:
      tags: [trading]
      summary: Delivery history with per-channel status and the reason for anything held (P10 D9)
      description: |-
        `digest_scheduled` is HELD — quiet hours or a digest window — and `dropped_rate_limited` is REFUSED by the
        rule's own cap. Two different facts, and a screen that renders them the same way sends a user looking for
        a broken channel. `latencyMs` is null where nothing was sent: a zero on a row that never went out is the
        kind of number that makes a dashboard lie with a straight face.

        Test fires are present and flagged `isTest`, so a history can show them apart from real alerts.
      operationId: listAlertDeliveries
      x-auth: user
      x-rate-class: authed-read
      x-cache: no-store
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: channel, in: query, required: false, schema: {type: string, maxLength: 16}}
      responses:
        "200":
          description: deliveries, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [rows, counts, note]
                    properties:
                      rows:
                        type: array
                        items: {$ref: "#/components/schemas/AlertDelivery"}
                      counts: {type: object}
                      note: {type: string}
        "401": {$ref: "#/components/responses/Denied"}
        "500": {$ref: "#/components/responses/Internal"}
  /v1/alerts/settings:
    post:
      tags: [trading]
      summary: Quiet hours, digest mode and the default channel (P10 D9)
      description: |-
        Every field is optional and an absent field means "leave it": a settings form that required the whole
        object would overwrite what it does not know, which is how a quiet window disappears when somebody
        changes their digest time.

        A quiet window needs both ends or neither, and a window that starts and ends at the same minute is
        refused rather than treated as closed. Quiet hours hold everything, urgent included — a digest is our
        batching, quiet hours are the user's instruction — and the response says so in `note` so the screen can
        repeat it next to the control.
      operationId: setAlertSettings
      x-auth: user
      x-rate-class: authed-write
      x-cache: no-store
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                quietStartMin: {type: integer, minimum: -1, maximum: 1439, description: "minutes past midnight, -1 = off"}
                quietEndMin: {type: integer, minimum: -1, maximum: 1439}
                tzOffsetMin: {type: integer, minimum: -840, maximum: 840, description: "minutes EAST of UTC"}
                digestMode: {type: string, enum: [off, hourly, daily]}
                digestAtMin: {type: integer, minimum: 0, maximum: 1439}
                defaultChannel: {type: string, enum: [telegram, email, webhook]}
      responses:
        "200":
          description: the settings as saved, with what they mean right now
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - $ref: "#/components/schemas/NotificationSettings"
        "400": {$ref: "#/components/responses/Validation"}
        "401": {$ref: "#/components/responses/Denied"}
        "422": {$ref: "#/components/responses/Validation"}
        "500": {$ref: "#/components/responses/Internal"}

  /v1/copy/configs:
    get:
      tags: [trading]
      summary: This account's copy configs, with the pre-confirm warning and the source's record (P10 D7)
      description: |
        The list sorts a source by RISK-ADJUSTED return, not raw PnL, and says so in `sourceStats.ranking`:
        a $50k profit with a $40k drawdown and a $50k profit with a $4k drawdown are not the same product, and
        a list ordered by the first number is a list that sells the second one as a surprise.

        Each config carries `warning` - the slippage this SOURCE actually produced, measured on our own copies -
        and `sourceStats`, including windows where the source lost money. A copy screen that only shows
        winners is the feature working as a trap.
      operationId: listCopyConfigs
      x-auth: user
      x-rate-class: authed-read
      x-cache: no-store
      responses:
        "200":
          description: configs for this account
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [items, count, note]
                    properties:
                      items:
                        type: array
                        items: {$ref: "#/components/schemas/CopyConfig"}
                      count: {type: integer}
                      note: {type: string}
        "401": {$ref: "#/components/responses/Denied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
        "500": {$ref: "#/components/responses/Internal"}
    post:
      tags: [trading]
      summary: Create a copy config - always in DRY-RUN (P10 D7)
      description: |
        Creation never enables live copying. The response carries the slippage warning the confirm dialog will
        show and the source's own record, and turning a config live is a separate call that must both
        acknowledge the slippage and point at dry-run history this account already produced.

        `sourceAnon` is a pseudonym, not an address. The engine resolves it internally; a client never needs
        the address to copy somebody, and a client that has it is a client that can leak it.
      operationId: createCopyConfig
      x-auth: user
      x-rate-class: authed-write
      x-cache: no-store
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceAnon, maxOrderMicro, maxDailyMicro]
              properties:
                sourceAnon:
                  type: string
                  description: the pseudonym from `anonWallet`
                mode: {type: string, enum: [cap, ratio], default: cap}
                ratioBps:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  description: required when mode=ratio; the multiplier in basis points (10000 = 1x mirror)
                maxOrderMicro: {type: integer, minimum: 1000000, description: "per-trade cap, micro-USDC"}
                maxDailyMicro: {type: integer, minimum: 1000000, description: "daily cap, micro-USDC"}
                blockedMarkets:
                  type: array
                  items: {type: string}
                  maxItems: 50
      responses:
        "200":
          description: the config, its warning, and the source's record
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [configId, sourceAnon, dryRun, warning, sourceStats, next]
                    properties:
                      configId: {type: string}
                      sourceAnon: {type: string}
                      mode: {type: string}
                      dryRun:
                        type: boolean
                        const: true
                        description: creation is dry-run by construction; the const is the contract's promise
                      maxOrderMicro: {type: integer}
                      maxDailyMicro: {type: integer}
                      warning: {$ref: "#/components/schemas/SlippageFacts"}
                      sourceStats: {$ref: "#/components/schemas/SourceStats"}
                      next: {type: string}
        "400":
          description: missing Idempotency-Key; a malformed one is a 422 naming the field
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Denied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}

        "500": {$ref: "#/components/responses/Internal"}
  /v1/copy/configs/guards:
    post:
      tags: [trading]
      summary: Set the guard rails, including turning dry-run off (P10 D7)
      description: |
        Refused with 409 `REFUSED` unless the caller sends `acknowledgeSlippage: true` AND the config already
        has at least one dry-run event recorded. The second condition is the interesting one: nobody goes live
        before the system has shown them, in their own account, what the strategy would have done. A dialog that
        asks "are you sure?" costs nothing and prevents nothing; a required dry-run history is evidence, and it
        is the difference between a warning and a gate.
      operationId: setCopyGuards
      x-auth: user
      x-rate-class: authed-write
      x-cache: no-store
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [configId]
              properties:
                configId: {type: string}
                dryRun:
                  type: boolean
                  description: false is the only way live copying starts, and it needs the two conditions above
                acknowledgeSlippage: {type: boolean}
                skipIfMovedCents:
                  type: integer
                  minimum: 0
                  maximum: 50
                  description: >-
                    skip the copy if the price moved this many cents against us before we could act. DEFAULT 2,
                    and the default is "skip instead of chase": a copied fill that chases is the one that turns
                    a good source's record into a bad copier's.
                doNotEnterWithinHours:
                  type: integer
                  minimum: 0
                  maximum: 168
                  description: default 24. Entering a market that resolves in minutes is a coin flip with fees.
                categoryFilter:
                  type: string
                  description: only copy into this category; '' means every category
                minPriceMicro: {type: integer, minimum: 1, maximum: 999999}
                maxPriceMicro: {type: integer, minimum: 1, maximum: 999999}
                takeProfitMicro: {type: integer, minimum: 1, maximum: 999999}
                stopLossMicro: {type: integer, minimum: 1, maximum: 999999}
      responses:
        "200":
          description: the config with its guards; `dryRun:false` means live copying has begun
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - $ref: "#/components/schemas/CopyConfig"
        "400":
          description: missing Idempotency-Key; a malformed one is a 422 naming the field
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Denied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: >-
            REFUSED - the state does not allow this yet (no acknowledged slippage, or no dry-run history for
            this config). Distinct from 400 on purpose: the body was well-formed and the request is refused by
            the state, and a client that retries a 400 forever is worse than one that knows to wait.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422": {$ref: "#/components/responses/Validation"}

        "500": {$ref: "#/components/responses/Internal"}
  /v1/copy/configs/monitor:
    get:
      tags: [trading]
      summary: Source price vs our fill vs slippage, and every skip with its reason (P10 D7)
      description: |
        Real fills (`copy_events`) and would-be fills (`copy_dry_runs`) are two lists, not one time-ordered
        stream. The one thing this screen must never allow is mistaking a simulation for a trade, and a merged
        list is exactly how that happens; every row carries `dryRun` for the same reason, and so does a fill
        with no intent: a copied event with an empty `intentId` never reached the venue.
      operationId: getCopyMonitor
      x-auth: user
      x-rate-class: authed-read
      x-cache: no-store
      parameters:
        - name: configId
          in: query
          required: true
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        "200":
          description: both lists, the slippage the source produced, and why the skips were skipped
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [configId, sourceAnon, live, wouldDo, skips, slippage, sourceStats, skipReasons]
                    properties:
                      configId: {type: string}
                      sourceAnon: {type: string}
                      live:
                        type: array
                        items: {$ref: "#/components/schemas/CopyEvent"}
                      wouldDo:
                        type: array
                        items: {$ref: "#/components/schemas/CopyEvent"}
                      skips:
                        type: array
                        description: the subset of `live` the engine refused to copy, with the engine's reason
                        items: {$ref: "#/components/schemas/CopyEvent"}
                      slippage: {$ref: "#/components/schemas/SlippageFacts"}
                      sourceStats: {$ref: "#/components/schemas/SourceStats"}
                      skipReasons:
                        type: array
                        items: {type: string}
        "401": {$ref: "#/components/responses/Denied"}
        "404": {$ref: "#/components/responses/NotFound"}

        "500": {$ref: "#/components/responses/Internal"}
  /v1/me/portfolio:
    get:
      tags: [trading]
      summary: Positions marked, grouped by event, with the curve and the benchmark (P10 D6)
      description: |
        Positions marked at the last fill we saw, grouped by event where the event is negRisk (exactly one
        outcome pays, so a long-Yes book across k outcomes is one position with k legs and the group's ceiling
        is the best leg, not the sum), the order history with its `unknown` rows INTACT, and the realised curve
        against a stated benchmark.

        Rows whose lifecycle we cannot name are returned rather than filtered: a table that hides them claims
        every order resolved, and the reason a user needs is usually in `reason`. A position with no mark is
        returned with an empty `mark` and `markSource: unknown` - dropping it would mean a position stops
        existing as far as its holder is concerned.
      operationId: getPortfolio
      x-auth: user
      x-rate-class: authed-read
      x-cache: no-store
      responses:
        "200":
          description: positions, groups, orders, curve, totals, benchmark
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - $ref: "#/components/schemas/Portfolio"
        "401": {$ref: "#/components/responses/Denied"}

        "500": {$ref: "#/components/responses/Internal"}
  /v1/radar/runs:
    post:
      tags: [market]
      summary: Scan up to ten markets for the wallets worth watching (P10 D5)
      description: |
        Four rankings over one selection, and each answers a different question: who is most active here, who
        made money (sample-gated), who was earliest, and who holds several of these markets at once. Cost
        control is part of the contract rather than an operational footnote: a scan is cached for 60 seconds,
        the same markets in a different order are the same scan, an account has a daily scan budget, and past
        six uncached markets the scan runs as a job so the page does not wait on it.
      operationId: createRadarRun
      x-auth: user
      x-rate-class: metered
      x-cache: no-store
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [marketIds]
              properties:
                # The count is documented here and ENFORCED in the app, so that the refusal can say what the
                # limit is and what the request contained: a schema-level `maxItems` answers first with
                # "outside the range", which is true and tells the user nothing.
                marketIds:
                  type: array
                  items: {type: string, minLength: 3, maxLength: 128}
                ranking: {type: string, enum: [active, profit, earliest, overlap]}
      responses:
        "200":
          description: the rankings; `quota.jobId` is set when the scan was enqueued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - $ref: "#/components/schemas/RadarResult"
        "400":
          description: missing Idempotency-Key; a malformed one is a 422 naming the field
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Denied"}
        # RADAR_SCOPE, with the limit and the count in the message: a user who selected eleven markets needs
        # to know the limit is ten, and "outside the range" is not that sentence.
        "422": {$ref: "#/components/responses/Validation"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/Internal"}
  /v1/radar/runs/{job_id}:
    get:
      tags: [market]
      summary: Collect a radar scan that ran as a job (P10 D5)
      description: |
        The job executes on the first poll and exactly once; the second poll reads the completed result and the
        scan is cached by then. Polling is what the UI does with `quota.jobId`, so a slow scan costs one
        request that returns immediately plus whatever the client's poll interval is.
      operationId: getRadarRun
      x-auth: user
      x-rate-class: authed-read
      x-cache: no-store
      parameters:
        - {name: job_id, in: path, required: true, schema: {type: string, minLength: 3, maxLength: 64}}
      responses:
        "200":
          description: the scan's result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - $ref: "#/components/schemas/RadarResult"
        "401": {$ref: "#/components/responses/Denied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/Internal"}
  /v1/whale-views:
    get:
      tags: [market]
      summary: This account's saved whale views (P10 D4)
      description: |
        A saved view is a name plus the filters it was saved with, and optionally the alert rule it is bound
        to. `notifies` says whether the view is allowed to fire: a view bound to a rule that has no target
        cannot notify, because an alert with no target is a notification about nothing.
      operationId: listWhaleViews
      x-auth: user
      x-rate-class: authed-read
      x-cache: no-store
      responses:
        "200":
          description: saved views
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [items, count]
                    properties:
                      items:
                        type: array
                        items: {$ref: "#/components/schemas/WhaleView"}
                      count: {type: integer}
        "401": {$ref: "#/components/responses/Denied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Validation"}
        "500": {$ref: "#/components/responses/Internal"}
    post:
      tags: [market]
      summary: Save a whale view, optionally with its alert rule (P10 D4)
      description: |
        The same call creates the view and, when a channel is given, the alert rule it fires through: D4 asks
        for alert-rule creation inline, and an inline form that posts to a second endpoint is an inline form
        that loses what the user just typed.
      operationId: createWhaleView
      x-auth: user
      x-rate-class: authed-write
      x-cache: no-store
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 48}
                minSeverity: {type: string, enum: [info, notice, urgent], default: notice}
                minNotionalMicro: {type: integer, minimum: 0}
                multiple: {type: integer, minimum: 2, maximum: 1000}
                marketId:
                  type: string
                  description: per-market view; absent means a global one
                channel:
                  type: string
                  enum: [telegram, email, webhook]
                  description: >-
                    when present this view NOTIFIES, which requires a target - a per-market view sets one. A
                    global view with a channel is refused (the schema's own rule, `rule_has_target`).
                severity: {type: string, enum: [info, notice, urgent], default: notice}
                firesPerWindow: {type: integer, minimum: 1, maximum: 100}
                ruleWindowMs: {type: integer, minimum: 60000, maximum: 86400000}
      responses:
        "200":
          description: the saved view, with the rule it created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - $ref: "#/components/schemas/WhaleView"
        "400":
          description: missing Idempotency-Key; a malformed one is a 422 naming the field
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Denied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Validation"}

        "500": {$ref: "#/components/responses/Internal"}
  /v1/leaderboard:
    get:
      tags: [leaderboard]
      summary: One board — rows with their components, the refusals with their reasons, and the freshness (P11 D2)
      description: |-
        Six boards share this read: `risk_adjusted` (the default), `win_rate`, `volume`, `rising`, `category`
        and `copied`. `window` must be one the board actually reads — there is no 24-hour SKILL board, because
        ranking a win rate on a day's sample would print a number with no sample behind it and call it a
        leaderboard.

        A wallet under the gate is not hidden: it appears in `unranked` with the number that refused it ("9
        settled markets; this board needs 20"). A blown-up wallet keeps its real, negative score and stays on
        the board, and `summary.blewUpCount` counts it. Every row states the components it was ranked on, the
        window its turnover came from, and any label that applies to it — each with the rule behind it.
      operationId: getLeaderboard
      x-auth: none
      x-rate-class: public-read
      x-cache: short
      parameters:
        - name: board
          in: query
          schema:
            type: string
            enum: [risk_adjusted, win_rate, volume, rising, category, copied]
        - name: window
          in: query
          schema:
            type: string
            enum: [24h, 7d, 30d, 90d, all]
            description: defaults to the board's own default; a window the board does not read is a 422
        - name: category
          in: query
          schema: {type: string, maxLength: 32}
          description: required by the category board; one of Politics/Sports/Crypto/Finance
        - name: q
          in: query
          schema: {type: string, maxLength: 64}
          description: filter rows by pseudonym; `page.filtered` says the totals are the board's, not the filter's
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 5000, default: 0}
      responses:
        "200":
          description: the board, its rows, its refusals, its counts and its freshness
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - $ref: "#/components/schemas/LeaderboardBoard"
        "422": {$ref: "#/components/responses/Denied"}
        "500": {$ref: "#/components/responses/Internal"}

  /v1/leaderboard/boards:
    get:
      tags: [leaderboard]
      summary: The board picker
      description: |-
        Generated from the same specification the engine ranks from, so a board that exists in the engine and
        not in the picker cannot happen. `isDefault` is on `risk_adjusted`, not on the venue's volume board:
        volume rewards churn, and a board that can be topped by round-tripping tells a stranger to copy the
        wrong wallet.
      operationId: listLeaderboardBoards
      x-auth: none
      x-rate-class: public-read
      x-cache: long
      responses:
        "200":
          description: the boards, their formulas, gates, windows and cadences
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - $ref: "#/components/schemas/LeaderboardBoards"
        "500": {$ref: "#/components/responses/Internal"}

  /v1/leaderboard/methodology:
    get:
      tags: [leaderboard]
      summary: The published methodology, as the same object the engine reads
      description: |-
        The boards with their formulas, gates, tie-breaks and cadences, the six integrity rules each with what
        it does AND what it does not do, and the window each board actually reads. Served rather than written
        down separately — a methodology page maintained by hand beside a ranking engine maintained in code is
        two authorities over one number, and the first disagreement is the one a user screenshots.
      operationId: getLeaderboardMethodology
      x-auth: none
      x-rate-class: public-read
      x-cache: long
      responses:
        "200":
          description: the methodology
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - $ref: "#/components/schemas/LeaderboardMethodology"
        "500": {$ref: "#/components/responses/Internal"}

  /v1/leaderboard/why:
    get:
      tags: [leaderboard]
      summary: Why one wallet is above another, in one sentence, with both component sets
      description: |-
        This is the phase's own acceptance question, served: "a trader at rank 47 with fewer resolved markets
        than the trader at rank 12" is answered with numbers rather than adjectives, and the sentence names the
        sample explicitly in both directions — the sample gate decides ELIGIBILITY, never order.
      operationId: explainLeaderboardRank
      x-auth: none
      x-rate-class: public-read
      x-cache: short
      parameters:
        - {name: a, in: query, required: true, schema: {type: string, minLength: 4, maxLength: 64}}
        - {name: b, in: query, required: true, schema: {type: string, minLength: 4, maxLength: 64}}
        - name: board
          in: query
          schema:
            type: string
            enum: [risk_adjusted, win_rate, volume, rising, category, copied]
        - name: window
          in: query
          schema: {type: string, enum: [24h, 7d, 30d, 90d, all]}
        - {name: category, in: query, schema: {type: string, maxLength: 32}}
      responses:
        "200":
          description: the sentence, both rows, and both components sets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - $ref: "#/components/schemas/LeaderboardWhy"
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Denied"}
        "500": {$ref: "#/components/responses/Internal"}

  /v1/leaderboard/snapshots:
    get:
      tags: [leaderboard]
      summary: One wallet's rank history per board — the source of the 30-day sparkline
      description: |-
        Read from `leaderboard_snapshots` and nothing else. A rank recomputed from today's ledger is today's
        rank, not the rank they had last Tuesday: "were they falling?" is a question about the past, and only a
        written-down past answers it. `delta` is a change in RANK, so a negative number is an improvement.
      operationId: getLeaderboardSnapshots
      x-auth: none
      x-rate-class: public-read
      x-cache: short
      parameters:
        - {name: anon, in: query, required: true, schema: {type: string, minLength: 4, maxLength: 64}}
        - {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 90, default: 30}}
      responses:
        "200":
          description: rank history, per board
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - $ref: "#/components/schemas/LeaderboardSnapshots"
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/Internal"}

  /v1/leaderboard/runs:
    get:
      tags: [leaderboard]
      summary: The recompute record, newest first
      description: |-
        Public on purpose: a cadence nobody can check is a claim. `freshness` states each board's snapshot age
        against the cadence that board declares, so "is this stale" is a comparison rather than a reading of a
        sentence.
      operationId: listLeaderboardRuns
      x-auth: none
      x-rate-class: public-read
      x-cache: short
      parameters:
        - {name: board, in: query, schema: {type: string, maxLength: 32}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 24}}
      responses:
        "200":
          description: the run rows and the per-board freshness
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - $ref: "#/components/schemas/LeaderboardRuns"
        "500": {$ref: "#/components/responses/Internal"}

  /v1/leaderboard/recompute:
    post:
      tags: [leaderboard]
      summary: Write the rank history — one snapshot per wallet per board, plus the integrity verdict
      description: |-
        Deterministic and idempotent per `Idempotency-Key`: a repeated key returns the first run's answer rather
        than appending a second history point. The run table is keyed by (board, window, hour), so a recompute
        inside the same hour replaces that hour's row instead of inventing cadence we did not have.

        `boards` and `window` are optional; without them every board is written at its own default window.
      operationId: recomputeLeaderboard
      x-auth: user
      x-rate-class: authed-write
      x-cache: no-store
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                boards:
                  type: array
                  minItems: 1
                  maxItems: 6
                  items: {type: string, enum: [risk_adjusted, win_rate, volume, rising, category, copied]}
                window: {type: string, enum: [24h, 7d, 30d, 90d, all]}
      responses:
        "200":
          description: what was written
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - $ref: "#/components/schemas/LeaderboardRecompute"
        "400": {$ref: "#/components/responses/Denied"}
        "401": {$ref: "#/components/responses/Denied"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Denied"}
        "500": {$ref: "#/components/responses/Internal"}

components:
  headers:
    xRequestId:
      description: echoed if sent, generated otherwise; appears on every response including errors
      schema: {type: string}

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        8-128 chars of [A-Za-z0-9_-]. Required on every mutating endpoint; the 400 for its absence is part
        of the contract so a client cannot "just try without it" once and conclude it is optional.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{8,128}$'
    UserId:
      name: X-User-Id
      in: header
      required: false
      description: |
        dev only (PGM_AUTH_MODE=dev-header). In every other deployment this is a bearer token and the user id
        comes from it; a header a client can set is not an authentication mechanism.
      schema: {type: string}
  schemas:
    # ---------------------------------------------------------------- P10 · terminal rows and dossiers
    LabelFact:
      type: object
      description: >-
        one PUBLISHABLE classification label with the rule that produced it and its disclaimer. P09's `Labels`
        carries the label NAMES; the terminal's rows carry the facts, because D2's badge tooltip has to state
        the exact rule and a rule that only arrives on another endpoint is a rule most users never see.
      required: [label, confidence, rule, disclaimer]
      properties:
        label: {type: string, enum: [whale, smart_money, new_wallet, cluster, wash_like]}
        confidence: {type: integer, minimum: 0, maximum: 1000, description: "the classifier's own confidence, per mille"}
        rule: {type: string, description: "the threshold sentence, in the words the classifier ran"}
        disclaimer: {type: string, description: "what the label does NOT claim; required wherever the label is shown"}
        evidence:
          type: object
          description: the numbers behind the call, so a user can disagree with the classifier and say why

    WhaleThreshold:
      type: object
      description: >-
        `max(p99.5 of this market's window fills, $500 floor)`. Below 40 fills in the window the relative term
        is DISCARDED and the floor applies alone (`sampleOk: false`), because a p99.5 of five fills is a
        statement about five fills. `reason` names the term that won, so a threshold is reproducible instead of
        trusted.
      required: [thresholdMicro, fills, reason, rule]
      properties:
        thresholdMicro: {type: integer, minimum: 1}
        fills: {type: integer, minimum: 0}
        medianMicro: {type: integer, minimum: 0}
        p995Micro: {type: integer, minimum: 0}
        relativeMicro: {type: integer, minimum: 0, description: "the p99.5 term, before the floor"}
        floorMicro: {type: integer, minimum: 0, description: "the absolute floor ($500) or a size-bucket override"}
        sampleOk: {type: boolean, description: "false when the window has too few fills for a percentile"}
        mode: {type: string, description: "'relative' (default) or 'multiple' when the caller supplied N x median"}
        multiple: {type: ["integer", "null"]}
        reason: {type: string, enum: [relative, absolute_floor, absolute_fallback]}
        rule: {type: string}

    TerminalFill:
      type: object
      description: >-
        one fill row of the terminal tape. Same names and kinds as `DurableFill` (`price`, `shares` and
        `notional` as decimal strings), plus the market's own identity for the one-click jump, the labels with
        their rules, and the threshold the row was judged against. `tsMs` + `lagMs` replace `venueTs` +
        `ingestMs`: the tape renders one timestamp and how far behind the feed is, and shipping two clocks to
        a client that needs one is how a client ends up comparing them.
      required: [tsMs, price, shares, notionalMicro, side, anonWallet, marketId, tick, thresholdMicro, isWhale]
      properties:
        tsMs: {type: integer, description: "venue clock, ms - the same clock the cursor uses"}
        lagMs: {type: integer, minimum: 0, description: "ingest minus venue; the freshness indicator's number"}
        conditionId: {type: string}
        tokenId: {type: string}
        marketId: {type: string, description: "our id, for the row's market link; '' when the market is not in our catalogue"}
        marketSlug: {type: string}
        question: {type: string, description: "venue text, rendered as sanitised PLAIN TEXT by the client"}
        category: {type: string}
        tick: {type: string, description: "the market's tick, because a price string cannot be rendered without it"}
        side: {type: string, enum: [BUY, SELL]}
        outcome: {type: string}
        price: {$ref: "#/components/schemas/Price"}
        shares: {type: string, pattern: '^[0-9]+(\.[0-9]{1,6})?$'}
        notionalMicro:
          type: integer
          description: micro-USDC, exact; the field the whale rule is expressed against
        anonWallet: {type: string}
        labels:
          type: array
          items: {$ref: "#/components/schemas/LabelFact"}
        source: {type: string, enum: [rest, ws]}
        thresholdMicro: {type: integer}
        thresholdRule: {type: string, description: "the sentence the badge tooltip shows"}
        thresholdReason: {type: string, enum: [relative, absolute_floor, absolute_fallback]}
        severity: {type: string, enum: [info, notice, urgent]}
        ratioBps: {type: integer, description: "notional / threshold, in bps; 10000 = exactly at the threshold"}
        rule: {type: string, description: "the severity formula, stated on every row that carries a severity"}
        isWhale: {type: boolean, description: "notionalMicro >= thresholdMicro, computed server-side so no client re-derives it"}

    TapeCounts:
      type: object
      required: [returned, whales, hasMore]
      properties:
        returned: {type: integer}
        whales: {type: integer}
        hasMore:
          type: boolean
          description: "computed from limit+1, not inferred from a full page: a page that ends on a boundary is not a hasMore"
        overThresholdOnPage: {type: integer}

    FacetBucket:
      type: object
      required: [value, fills, notionalMicro]
      properties:
        value: {type: string}
        fills: {type: integer}
        notionalMicro: {type: integer}

    FacetMarket:
      type: object
      required: [marketId, fills, notionalMicro, thresholdMicro]
      properties:
        marketId: {type: string}
        slug: {type: string}
        question: {type: string}
        category: {type: string}
        fills: {type: integer}
        notionalMicro: {type: integer}
        whales: {type: integer}
        thresholdMicro: {type: integer}
        thresholdRule: {type: string}
        thresholdReason: {type: string}
        sizeBucket:
          type: string
          enum: [small, mid, large]
          description: >-
            the market's own size class, derived from its median fill; D4's tunable defaults hang off it, so a
            $500 floor on a market whose median fill is $4 and on one whose median is $900 are the same number
            and not the same rule
        bucketFloorMicro: {type: integer}

    TapeFacets:
      type: object
      required: [fills, medianNotionalMicro, whale, sides, categories, classifications]
      properties:
        marketId: {type: ["string", "null"]}
        windowMs: {type: integer}
        fills: {type: integer}
        sampleMax: {type: integer}
        sampled:
          type: boolean
          description: true when the window held more fills than the in-process sample cap; the counts are then
            of the sample, and a facet count that quietly means something else is a facet count nobody can trust
        medianNotionalMicro: {type: integer}
        p95NotionalMicro: {type: integer}
        maxNotionalMicro: {type: integer}
        whale: {$ref: "#/components/schemas/WhaleThreshold"}
        severityRule: {type: string}
        sides:
          type: array
          items: {$ref: "#/components/schemas/FacetBucket"}
        outcomes:
          type: array
          items: {$ref: "#/components/schemas/FacetBucket"}
        categories:
          type: array
          items: {$ref: "#/components/schemas/FacetBucket"}
        sources:
          type: array
          items: {$ref: "#/components/schemas/FacetBucket"}
        wallets:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/FacetBucket"
              - type: object
                required: [anonWallet]
                properties:
                  anonWallet: {type: string}
                  labels:
                    type: array
                    items: {$ref: "#/components/schemas/LabelFact"}
        markets:
          type: array
          items: {$ref: "#/components/schemas/FacetMarket"}
        classifications:
          type: array
          description: label, how many wallets carry it, and how many fills they made - the counts a user needs
            to judge whether a filter is worth applying
          items:
            type: object
            required: [label, wallets, fills]
            properties:
              label: {type: string}
              wallets: {type: integer}
              fills: {type: integer}
              rule: {type: string}
              disclaimer: {type: string}

    WhaleFeed:
      type: object
      required: [scope, windowMs, rows, counts, thresholds]
      properties:
        scope: {type: string, enum: [global, market]}
        marketId: {type: ["string", "null"]}
        windowMs: {type: integer}
        multiple: {type: ["integer", "null"]}
        rows:
          type: array
          maxItems: 200
          items: {$ref: "#/components/schemas/TerminalFill"}
        counts:
          type: object
          required: [overThreshold, returned, marketsWithFills]
          properties:
            overThreshold: {type: integer}
            returned: {type: integer}
            marketsWithFills: {type: integer}
        thresholds:
          type: object
          description: per market id, the threshold this feed applied; present even for markets the page cut off,
            so a missing row is explicable
          additionalProperties: {$ref: "#/components/schemas/WhaleThreshold"}

    TraderMetric:
      type: object
      description: >-
        one window of the metric set D3 requires to be recomputed as a WHOLE when the window changes. Every
        field is here for every window: a switcher that swaps some numbers and leaves others is a screen that
        cannot be read.
      required: [fills, resolvedMarkets, wins, insufficientSample, sampleGate, volumeMicro, realisedMicro,
                 unrealisedMicro, maxDrawdownMicro, avgHoldMs]
      properties:
        fills: {type: integer}
        resolvedMarkets:
          type: integer
          description: settled markets this wallet traded - the denominator of the win rate, per MARKET and not
            per fill, because a wallet that bought six times and sold once made one decision
        wins: {type: integer}
        winRateBps:
          type: ["integer", "null"]
          description: 'null below the sample gate. Never rendered as a percentage: "2 of 3" is not 67%'
        insufficientSample: {type: boolean}
        sampleNote: {type: string, description: "the sentence the UI shows instead of a win rate"}
        sampleGate: {type: integer}
        volumeMicro: {type: integer}
        realisedMicro: {type: integer, description: "settled markets only"}
        unrealisedMicro: {type: integer, description: "open positions at the last mark we hold; 0 when none"}
        bestMicro: {type: integer}
        worstMicro: {type: integer}
        maxDrawdownMicro: {type: integer, minimum: 0}
        avgHoldMs: {type: integer}
        medianHoldMs: {type: integer}
        openFills: {type: integer}
        matchedPositions: {type: integer}
        distinctMarkets: {type: integer}
        categories: {type: integer}
        source: {type: string, enum: [rollup, sampled]}
        asOfMs: {type: integer}
        computedMs: {type: integer}
        storedWinRateBps: {type: ["integer", "null"], description: "the materialised row's value, when one exists"}

    CurvePoint:
      type: object
      description: >-
        one point of the cumulative realised curve. `peakMicro` and `drawdownMicro` are REQUIRED: the prompt's
        constraint is that drawdown appears wherever PnL appears, and the way to make that structural is for a
        curve point to be unable to exist without it.
      required: [tsMs, cumMicro, peakMicro, drawdownMicro]
      properties:
        tsMs: {type: integer}
        cumMicro: {type: integer}
        peakMicro: {type: integer}
        drawdownMicro: {type: integer, minimum: 0}
        openPositions: {type: integer}

    TraderDossier:
      type: object
      required: [anonWallet, window, windows, metrics, curve, curveSource, maxDrawdownMicro, breakdown,
                 positions, fills, behaviour, methodology]
      properties:
        anonWallet: {type: string}
        window: {type: string, enum: [7d, 30d, 90d, all]}
        windows: {type: array, items: {type: string}}
        metrics:
          type: object
          additionalProperties: {$ref: "#/components/schemas/TraderMetric"}
        curve:
          type: array
          items: {$ref: "#/components/schemas/CurvePoint"}
        curveWindow: {type: string}
        curveSource: {type: string, enum: [rollup, sampled]}
        maxDrawdownMicro: {type: integer, minimum: 0}
        breakdown:
          type: array
          description: category shares in bps, with a denominator of the sum of |realised| per category so the
            shares of a mixed win/loss book add to 10000
          items:
            type: object
            required: [category, fills, notionalMicro, realisedMicro, shareBps]
            properties:
              category: {type: string}
              fills: {type: integer}
              notionalMicro: {type: integer}
              realisedMicro: {type: integer}
              shareBps: {type: integer}
        positions:
          type: array
          items: {$ref: "#/components/schemas/Position"}
        fills:
          type: array
          maxItems: 40
          items: {$ref: "#/components/schemas/TraderFill"}
        behaviour:
          type: array
          description: >-
            the behaviour labels that ARE publishable, each with its methodology. `insider_suspect` is computed
            and stored but never published: a false accusation about a named person is not a feature, and the
            classifier's own false-positive rate is the reason the disclaimer exists.
          items: {$ref: "#/components/schemas/LabelFact"}
        methodology:
          type: object
          description: the sentence behind every number, shipped with the numbers it explains rather than behind
            a link a user has to go and find
          additionalProperties: true

    TraderFill:
      allOf:
        - $ref: "#/components/schemas/TerminalFill"
        - type: object
          required: [resolved, realisedMicro]
          properties:
            resolved: {type: boolean, description: "false while the market is open; realised is then 0 and not a guess"}
            winner: {type: ["boolean", "null"]}
            realisedMicro: {type: integer}

    Position:
      type: object
      required: [size, avgEntry, mark, unrealisedMicro, costBasisMicro, valueMicro, endsInMs]
      properties:
        marketId: {type: string}
        marketSlug: {type: string}
        question: {type: string}
        outcome: {type: string}
        tokenId: {type: string}
        size: {type: string, pattern: '^[0-9]+(\.[0-9]{1,6})?$'}
        avgEntry: {$ref: "#/components/schemas/Price"}
        mark:
          type: string
          description: >-
            the last fill WE have seen, as a price string; empty when we have none. Empty and "0" are different
            claims: empty is about our data, 0 is about the market.
        markSource: {type: string, enum: [last_fill, unknown]}
        costBasisMicro: {type: integer}
        valueMicro: {type: integer}
        unrealisedMicro: {type: integer}
        unrealisedBps: {type: integer}
        onTick: {type: boolean, description: "false when the mark is off the market's tick - a stale book's mark"}
        endsInMs: {type: integer, description: "negative once the market has ended"}
        shareOfPortfolioBps: {type: integer}

    SlippageFacts:
      type: object
      description: >-
        what this SOURCE's copies actually cost, measured on our own attempts: our fill price against theirs, in
        bps. Shown in the UI BEFORE the confirm, and the default is "skip instead of chase" - a copier who chases
        turns a good source's record into a bad copier's result.
      required: [samples, medianSlippageBps, skipRateBps, default, warning]
      properties:
        samples: {type: integer}
        medianSlippageBps: {type: integer}
        p90SlippageBps: {type: integer}
        worstSlippageBps: {type: integer}
        copied: {type: integer}
        skipped: {type: integer}
        skipRateBps: {type: integer}
        medianFillMicro: {type: integer}
        default: {type: string, description: "the policy default, stated rather than implied"}
        warning: {type: string, description: "the sentence the confirm dialog renders"}

    SourceStats:
      type: object
      required: [windows, ranking]
      properties:
        windows:
          type: array
          description: >-
            the source's OWN record, including the windows where it lost money. A copy screen that shows only
            winners is the feature working as a trap.
          items:
            type: object
            required: [windowDays, closedTrades, realisedMicro, netAfterFeesMicro, maxDrawdownMicro, insufficientSample]
            properties:
              windowDays: {type: integer}
              closedTrades: {type: integer}
              realisedMicro: {type: integer}
              feesMicro: {type: integer}
              netAfterFeesMicro: {type: integer}
              maxDrawdownMicro: {type: integer, minimum: 0}
              longestLosingStreak: {type: integer}
              avgLatencyMs: {type: integer}
              winRateBps: {type: ["integer", "null"]}
              insufficientSample: {type: boolean}
              sampleNote: {type: string}
              riskAdjustedBps:
                type: integer
                description: >-
                  net return per unit of drawdown, in bps - the ranking this list is sorted by. Raw PnL is
                  deliberately not the sort: $50k with a $40k drawdown and $50k with a $4k drawdown are not the
                  same product, and ordering by the first sells the second as a surprise.
              riskAdjustedNote: {type: string}
        ranking: {type: string, description: "the sentence that says HOW the list is sorted, in the payload"}

    CopySource:
      type: object
      required: [anonWallet, windowDays, closedTrades, realisedMicro, feesMicro, netAfterFeesMicro,
                 maxDrawdownMicro, longestLosingStreak, avgLatencyMs, winRateBps, insufficientSample,
                 sampleNote, sampleGate, riskAdjustedBps, riskAdjustedRule, copierCount, currentlyCopying,
                 myConfigs, updatedMs, rank]
      properties:
        anonWallet: {type: string, description: "a pseudonym; an address is never returned (P10 gate c2)"}
        windowDays: {type: integer}
        closedTrades: {type: integer}
        realisedMicro: {type: integer}
        feesMicro: {type: integer}
        netAfterFeesMicro: {type: integer, description: "signed, and returned negative when it is negative"}
        maxDrawdownMicro: {type: integer, description: "the denominator of the risk-adjusted ratio, stated"}
        longestLosingStreak: {type: integer}
        avgLatencyMs: {type: integer}
        winRateBps:
          type: [integer, "null"]
          description: "null when the source is below the sample gate; the reason is in sampleNote"
        insufficientSample: {type: boolean}
        sampleNote: {type: string}
        sampleGate: {type: integer}
        riskAdjustedBps: {type: integer}
        riskAdjustedRule: {type: string}
        copierCount: {type: integer}
        currentlyCopying: {type: boolean}
        myConfigs: {type: integer}
        updatedMs: {type: integer}
        rank: {type: integer}
    CopyConfig:
      type: object
      required: [configId, sourceAnon, mode, enabled, dryRun]
      properties:
        configId: {type: string}
        sourceAnon: {type: string}
        mode: {type: string, enum: [cap, ratio]}
        ratioBps: {type: ["integer", "null"]}
        maxOrderMicro: {type: integer}
        maxDailyMicro: {type: integer}
        enabled: {type: boolean}
        createdMs: {type: integer}
        pausedReason: {type: ["string", "null"]}
        dryRun:
          type: boolean
          description: >-
            true until the guards call has both an acknowledgement and dry-run history. A config with no guard
            row is DRY-RUN by construction - the default is safe because the alternative default is a config
            that starts trading the moment it is read.
        guardsFromRow: {type: boolean}
        skipIfMovedCents: {type: integer}
        doNotEnterWithinHours: {type: integer}
        categoryFilter: {type: string}
        minPriceMicro: {type: ["integer", "null"]}
        maxPriceMicro: {type: ["integer", "null"]}
        takeProfitMicro: {type: ["integer", "null"]}
        stopLossMicro: {type: ["integer", "null"]}
        warning: {$ref: "#/components/schemas/SlippageFacts"}
        sourceStats: {$ref: "#/components/schemas/SourceStats"}

    CopyEvent:
      type: object
      description: >-
        one row of the monitor. `dryRun: true` means the engine WOULD have done this; the two lists are separate
        because a merged one is how a simulation gets read as a trade.
      required: [action, atMs, dryRun]
      properties:
        action: {type: string}
        reason: {type: string, description: "why it was skipped/refused, in the engine's own words"}
        deviationBps: {type: integer}
        atMs: {type: integer}
        intentId:
          type: string
          description: 'empty on a skip and on a dry run: an event with no intent never reached the venue'
        marketId: {type: string}
        shares: {type: string}
        price: {$ref: "#/components/schemas/Price"}
        sourcePrice: {$ref: "#/components/schemas/Price"}
        dryRun: {type: boolean}

    Portfolio:
      type: object
      required: [positions, negRiskGroups, orders, unknownLifecycle, pnlCurve, totals, benchmark, csv, emptyState]
      properties:
        positions:
          type: array
          items: {$ref: "#/components/schemas/Position"}
        negRiskGroups:
          type: array
          description: >-
            event-level exposure for negRisk events: exactly one outcome pays, so the ceiling is the best leg and
            NOT the sum of the legs' quoted values, which is a number that cannot happen
          items:
            type: object
            required: [eventId, legs, valueMicro, costBasisMicro, maxPayoutMicro]
            properties:
              eventId: {type: string}
              eventTitle: {type: string}
              legs: {type: integer}
              valueMicro: {type: integer}
              costBasisMicro: {type: integer}
              maxPayoutMicro: {type: integer}
              unrealisedMicro: {type: integer}
        orders:
          type: array
          items:
            type: object
            required: [intentId, state, createdAt]
            properties:
              intentId: {type: string}
              marketId: {type: string}
              state: {type: string}
              reason: {type: ["string", "null"]}
              shares: {type: string}
              price: {$ref: "#/components/schemas/Price"}
              createdMs: {type: integer}
              notionalMicro: {type: integer}
              unknownLifecycle: {type: boolean}
        unknownLifecycle:
          type: array
          description: >-
            rows the venue reported in a state we do not model. Returned, never filtered: a table that hides them
            claims every order resolved.
          items:
            type: object
            required: [intentId, state, showAsWorking, atMs]
            properties:
              venueOrderId: {type: string}
              intentId: {type: string}
              state: {type: string}
              reason: {type: string}
              showAsWorking: {type: boolean}
              atMs: {type: integer}
              unknownLifecycle: {type: boolean}
        pnlCurve:
          type: array
          items: {$ref: "#/components/schemas/CurvePoint"}
        maxDrawdownMicro: {type: integer, minimum: 0}
        totals:
          type: object
          required: [valueMicro, cashMicro, equityMicro, unrealisedMicro, costBasisMicro]
          properties:
            valueMicro: {type: integer}
            cashMicro: {type: integer}
            equityMicro: {type: integer}
            unrealisedMicro: {type: integer}
            costBasisMicro: {type: integer}
        benchmark:
          type: object
          description: >-
            holding pUSD, named and valued in the payload rather than drawn as an unnamed second line: a
            benchmark a user cannot identify is decoration
          required: [kind, valueMicro, rateBps, note]
          properties:
            kind: {type: string}
            valueMicro: {type: integer}
            rateBps: {type: integer}
            note: {type: string}
        csv:
          type: object
          description: >-
            the column list, so the export a user downloads is the export they were shown. The rows are produced
            by the client from the same payload: an export endpoint that re-queries is an export that can
            disagree with the screen.
          required: [columns, note]
          properties:
            columns: {type: array, items: {type: string}}
            note: {type: string}
        emptyState: {type: string, description: "where to send a user with no positions (the markets page)"}

    WhaleView:
      type: object
      required: [viewId, name, filters, severity, scope, createdMs, notifies]
      properties:
        viewId: {type: string}
        name: {type: string}
        filters: {type: object, additionalProperties: true}
        channel: {type: ["string", "null"], enum: [telegram, email, webhook, null]}
        severity: {type: string, enum: [info, notice, urgent]}
        scope: {type: string, enum: [global, market]}
        marketId: {type: ["string", "null"]}
        ruleId: {type: ["string", "null"]}
        createdMs: {type: integer}
        notifies:
          type: boolean
          description: 'false for a view bound to no rule, or to a rule with no target: an alert with no target is a notification about nothing'
        firesPerWindow: {type: ["integer", "null"]}
        ruleWindowMs: {type: ["integer", "null"]}
        ruleEnabled: {type: ["boolean", "null"]}

    Price:
      description: |
        price in (0,1) USDC as a dot-decimal string with at most 6 decimals. Strings are not a stylistic
        choice: the venue's own client types these as float (py-clob-client-v2 1.1.0), and we refuse to let
        a JSON number become the input to a money path.
      type: string
      pattern: '^0?\.\d{1,6}$|^0$'
      examples: ["0.5", "0.999", "0.001"]

    Levels:
      type: array
      minItems: 0
      maxItems: 400
      items:
        type: object
        required: [price, shares, levels, cumShares]
        properties:
          price: {$ref: "#/components/schemas/Price"}
          shares: {type: string, pattern: '^[0-9]+(\.[0-9]{1,6})?$'}
          cumShares:
            type: string
            description: >-
              cumulative size from the top of this side, as a decimal string. Served rather than left to the
              client because deriving it means summing floats in a render loop, and the depth bar is a fraction
              of the largest cumulative figure on either side. P09 added it to the payload and to this schema in
              the same change: a field the ladder cannot work without is not optional documentation.
          levels:
            type: integer
            minimum: 1
            description: how many venue orders sit at this price; 1 is a real answer and must render

    Fill:
      type: object
      required: [price, size, side, exchangeTs]
      properties:
        price: {$ref: "#/components/schemas/Price"}
        size: {type: string}
        side: {type: string, enum: [BUY, SELL]}
        maker: {type: boolean}
        exchangeTs: {type: integer, description: "venue clock, ms"}
        ingestMs: {type: integer, description: "our clock, ms; freshness uses THIS, never exchangeTs"}

    DurableFill:
      type: object
      description: >-
        one row of `tape_fills`. `price`/`shares`/`notional` are decimal strings off integers, so the response
        cannot smuggle a float into a client that renders it as a money figure.
      required: [price, shares, notional, side, venueTs, ingestMs, source, anonWallet]
      properties:
        price: {$ref: "#/components/schemas/Price"}
        shares: {type: string, pattern: '^[0-9]+(\.[0-9]{1,6})?$'}
        notional: {type: string, pattern: '^[0-9]+(\.[0-9]{1,6})?$'}
        side: {type: string, enum: [BUY, SELL]}
        outcome: {type: string, description: "the venue's own label; '' when the row has none, never a guess"}
        venueTs: {type: integer, description: "ms, the venue's clock — the only clock a cursor may use"}
        ingestMs: {type: integer, description: "ms, our clock — the only clock freshness may use"}
        source: {type: string, enum: [rest, ws]}
        anonWallet:
          type: string
          description: >-
            sha256 of the counterparty address with a local prefix, 10 hex chars. The address itself is never
            returned: a public tape that echoes every trader's wallet is an address book of our users'
            counterparties, and `raw_json` is withheld for the same reason.
        labels: {$ref: "#/components/schemas/Labels"}

    Market:
      type: object
      description: >-
        the fields the risk gate reads (P01 D5.2) plus what the header renders. acceptingOrders,
        secondsDelay, minimumOrderSize and enableOrderBook are required because a missing one is a different
        order-management UI, not a default.
      required: [id, question, acceptingOrders, secondsDelay, minimumTickSize, minimumOrderSize, feeType,
                 enableOrderBook]
      properties:
        id: {type: string}
        question: {type: string}
        acceptingOrders: {type: boolean}
        secondsDelay: {type: integer, minimum: 0, maximum: 600}
        minimumTickSize:
          type: string
          enum: ["0.001", "0.01"]
          description: >-
            canonical text, normalised at the boundary - Postgres NUMERIC and SQLite REAL return this column
            differently, and the gate compares strings
        minimumOrderSize: {type: string}
        feeType: {type: string, description: "open taxonomy (6 values seen in P01); no enum on purpose"}
        enableOrderBook: {type: boolean}
        endDate: {type: ["integer", "null"]}
        # P09 · discovery. All optional: a row still renders with none of them, which is what lets the list
        # be used by a client that predates this phase instead of failing its schema validation.
        category: {type: string}
        eventId: {oneOf: [{type: string}, {type: "null"}]}
        outcomeCount: {type: integer}
        negRisk: {type: boolean}
        volume24h: {$ref: "#/components/schemas/Price"}
        liquidity: {$ref: "#/components/schemas/Price"}
        openInterest: {$ref: "#/components/schemas/Price"}
        lastPrice: {oneOf: [{$ref: "#/components/schemas/Price"}, {type: "null"}]}
        price24hAgo: {oneOf: [{$ref: "#/components/schemas/Price"}, {type: "null"}]}
        change24h:
          oneOf: [{$ref: "#/components/schemas/Price"}, {type: "null"}]
          description: >-
            signed difference of two prices in micro units, null when our tape does not reach back 24h. Zero
            would be a claim we do not have the data to make.
        spreadMicro:
          oneOf: [{type: integer}, {type: "null"}]
          description: integer micro units; null when one side is missing, which is not a spread of zero
        event: {$ref: "#/components/schemas/EventSummary"}
        # P09 · detail. `GET /v1/markets/{market_id}` serves these and the info rail renders them, so they are
        # declared here rather than left as fields the client reads from a shape it had to guess.
        slug: {type: string}
        eventTitle: {oneOf: [{type: string}, {type: "null"}]}
        eventSlug: {oneOf: [{type: string}, {type: "null"}]}
        volume7d: {$ref: "#/components/schemas/Price"}
        volume30d: {$ref: "#/components/schemas/Price"}
        resolutionSource:
          oneOf: [{type: string}, {type: "null"}]
          description: >-
            verbatim from the venue, including a `javascript:` URL if a market creator wrote one. It is data
            here on purpose: the client is what refuses to render it as a link, and a fixture that never reaches
            the client proves nothing about the client.
        resolutionCriteria:
          oneOf: [{type: string}, {type: "null"}]
          description: >-
            attacker-influenced text, returned verbatim and rendered as sanitised PLAIN TEXT by the client.
            Sanitising in the API would hide the fixture that proves the client does not trust it.
        holderCount:
          type: integer
          description: wallets WE have seen trade this market, not the venue's holder list, which does not exist
            for every market. The rail labels it "seen trading" for that reason.

    Labels:
      type: array
      items: {type: string, enum: [whale, smart_money, new_wallet, insider_suspect, cluster, wash_like]}
      description: published labels only; `insider_suspect` is never publishable, so it cannot appear here

    Candle:
      type: object
      description: >-
        one price bucket derived from our fills. A bucket with `trades: 0` does not exist in the array - the
        gaps are ABSENT rather than flat, because a candle drawn across a gap is a chart inventing prices.
      required: [t, o, h, l, c, shares, trades, notional]
      properties:
        t: {type: integer, description: bucket start, venue clock, ms}
        o: {$ref: "#/components/schemas/Price"}
        h: {$ref: "#/components/schemas/Price"}
        l: {$ref: "#/components/schemas/Price"}
        c: {$ref: "#/components/schemas/Price"}
        shares: {type: string}
        trades: {type: integer, minimum: 1}
        notional: {$ref: "#/components/schemas/Price"}

    EventSummary:
      type: object
      description: >-
        what a discovery card needs to summarise an event instead of listing it. The 128-outcome event is the
        reason this exists: a card that lists 128 rows is unreadable and one that shows the first three is
        wrong, so the card shows the top three BY 24h VOLUME and says how many it left out.
      required: [id, title, marketCount, totalVolume24h, topOutcomes, hiddenCount]
      properties:
        id: {type: string}
        title: {type: string}
        marketCount: {type: integer}
        totalVolume24h: {$ref: "#/components/schemas/Price"}
        hiddenCount: {type: integer}
        topOutcomes:
          type: array
          maxItems: 3
          items:
            type: object
            required: [marketId, question, price, volume24h]
            properties:
              marketId: {type: string}
              question: {type: string}
              price: {oneOf: [{$ref: "#/components/schemas/Price"}, {type: "null"}]}
              volume24h: {$ref: "#/components/schemas/Price"}

    Event:
      type: object
      required: [id, title, negRisk, marketCount]
      properties:
        id: {type: string}
        slug: {type: string}
        title: {type: string}
        negRisk: {type: boolean}
        category: {oneOf: [{type: string}, {type: "null"}]}
        endTs: {oneOf: [{type: integer}, {type: "null"}]}
        marketCount: {type: integer}

    EventOutcome:
      type: object
      description: one market under the event, i.e. one row of the 128-row table the client virtualises
      required: [marketId, question, acceptingOrders, minimumTickSize, minimumOrderSize, price, volume24h,
                 liquidity, summable]
      properties:
        marketId: {type: string}
        question: {type: string}
        acceptingOrders: {type: boolean}
        minimumTickSize: {type: string, enum: ["0.001", "0.01"]}
        minimumOrderSize: {type: string}
        price: {oneOf: [{$ref: "#/components/schemas/Price"}, {type: "null"}]}
        bestBid: {oneOf: [{$ref: "#/components/schemas/Price"}, {type: "null"}]}
        bestAsk: {oneOf: [{$ref: "#/components/schemas/Price"}, {type: "null"}]}
        volume24h: {$ref: "#/components/schemas/Price"}
        liquidity: {$ref: "#/components/schemas/Price"}
        openInterest: {$ref: "#/components/schemas/Price"}
        change24h: {oneOf: [{$ref: "#/components/schemas/Price"}, {type: "null"}]}
        summable:
          type: boolean
          description: >-
            false when the market has one side or none, so it has no mid. Excluded from the sum rather than
            borrowing its last trade price, which would put a stale number into a live invariant.

    Stamped:
      type: object
      description: every read payload carries these three fields
      required: [asOf, staleAfter, cache]
      properties:
        asOf: {type: integer, description: "ms epoch of the data, not of the response"}
        staleAfter:
          type: integer
          description: >-
            ms epoch after which the client must mark the data stale AND stop offering to trade (design
            system D5.5: 3s tape/book, 5s price, 120s metadata)
        cache:
          type: object
          required: [ttlMs, public]
          properties:
            ttlMs: {type: integer, minimum: 0}
            key: {type: ["string", "null"]}
            public: {type: boolean}
            immutable: {type: boolean}

    RadarRow:
      type: object
      required: [anonWallet, matched, fills, boughtMicro, soldMicro, realisedMicro, winRateBps,
                 insufficientSample, labels, rank, reason]
      additionalProperties: false
      description: >-
        One wallet in one ranking. `winRateBps` is null below the sample gate and `insufficientSample` says so,
        because a win rate off three resolved markets is a coin that landed twice. `matched` names the markets
        this wallet was found in, so "shared exposure" is checkable rather than asserted.
      properties:
        anonWallet: {type: string}
        matched:
          type: array
          items:
            type: object
            required: [marketId, question]
            properties:
              marketId: {type: string}
              question: {type: string}
        fills: {type: integer, minimum: 0}
        boughtMicro: {type: integer}
        soldMicro: {type: integer}
        realisedMicro: {type: integer, description: "realised only; an open position contributes nothing"}
        winRateBps: {type: [integer, "null"], minimum: 0, maximum: 10000}
        insufficientSample: {type: boolean}
        labels:
          type: array
          items: {$ref: "#/components/schemas/LabelFact"}
        rank: {type: integer, minimum: 1}
        reason: {type: string, description: "the sentence that explains this row's position in this ranking"}
    RadarResult:
      type: object
      required: [items, ranking, rankings, rankingsMeta, unranked, markets, scanned, sampleGate, quota, costNote]
      additionalProperties: true
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/RadarRow"}
        ranking: {type: string, enum: [active, profit, earliest, overlap]}
        rankings:
          type: object
          additionalProperties:
            type: array
            items: {$ref: "#/components/schemas/RadarRow"}
        rankingsMeta:
          type: array
          items:
            type: object
            required: [id, label, question]
            properties:
              id: {type: string}
              label: {type: string}
              question: {type: string}
        unranked:
          type: array
          description: wallets the profit ranking will not place, each with the gate's own sentence
          items: {type: object}
        markets:
          type: array
          items: {type: string}
        scanned: {type: integer, minimum: 0}
        sampleGate: {type: integer, minimum: 1}
        quota:
          type: object
          required: [plan, usedToday, perDay, cached, jobId, pollMs, note]
          properties:
            plan: {type: string}
            usedToday: {type: integer, minimum: 0}
            perDay: {type: integer, minimum: 1}
            cached: {type: boolean}
            jobId: {type: [string, "null"]}
            pollMs: {type: integer, minimum: 250}
            note: {type: string}
        costNote: {type: string}
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, retryable, requestId]
          additionalProperties: false
          description: >-
            no `detail` field, ever: that is where a Python message would leak. Logs carry the code and the
            request id instead.
          properties:
            code:
              type: string
              enum: [RISK_HALT, MARKET_NOT_ACCEPTING, NO_ORDER_BOOK, STALE_QUOTE, BAD_SIDE, UNKNOWN_TICK,
                     OFF_TICK, BAD_MARKET_META, BELOW_MIN_SIZE, ZERO_SIZE, BAD_AMOUNT, OVER_ORDER_CAP,
                     PRICE_FAR_FROM_MID, TOO_MANY_OPEN, DAILY_CAP, IDEM_CONFLICT, IDEM_IN_PROGRESS,
                     IDEM_KEY_REQUIRED, RISK_UNAVAILABLE, SIGNER_UNAVAILABLE, BAD_REASON, NOT_FOUND, REFUSED,
                     HALTED, RULE_CAP, DRY_RUN_REQUIRED, PLAN_REQUIRED,
                     VALIDATION, INTERNAL, UNAUTHENTICATED, SESSION_STALE, SESSION_REVOKED, SESSION_MISMATCH, ADMIN_REQUIRED, LOGIN_FAILED, ACCOUNT_LOCKED, TOTP_REQUIRED, TOTP_INVALID, TOTP_LOCKED, ADDRESS_COOLDOWN, ADDRESS_LIMIT, REMOVE_DURING_COOLDOWN, NO_SUCH_RESOURCE, REFRESH_UNKNOWN, REFRESH_REUSED, REFRESH_EXPIRED, TELEGRAM_REPLAY, TELEGRAM_INVALID, SECURITY_ENV_MISSING, KEYSTORE_TAMPER, BREAK_GLASS_DENIED, AUTHZ_UNDECLARED, BAD_FIELD, QUOTA_EXCEEDED, RADAR_SCOPE]
            message: {type: string, description: "user-safe by construction"}
            retryable: {type: boolean}
            requestId: {type: string}

    AutomationRule:
      type: object
      required: [ruleId, name, kind, status, statusWhy, enabled, nextEvaluationMs, runsToday, maxPerDay,
                 minIntervalMs, targets, trigger, actions]
      description: |-
        One rule as the console shows it. `status` is derived (active/paused/dry_run/halted) and `statusWhy` is
        the sentence beside the badge: "why is this not firing" is a question about a sentence, and a badge with
        a colour and no sentence is a badge nobody can act on.
      properties:
        ruleId: {type: string}
        name: {type: string}
        kind: {type: string}
        status: {type: string, enum: [active, paused, dry_run, halted]}
        statusWhy: {type: string}
        mode: {type: string, enum: [dry_run, live]}
        enabled: {type: boolean}
        pausedReason: {type: string}
        failureCount: {type: integer}
        lastError: {type: string}
        dryRunCompletedMs: {type: ["integer", "null"]}
        lastFiredMs: {type: ["integer", "null"]}
        lastEvaluationMs: {type: ["integer", "null"]}
        nextEvaluationMs: {type: integer}
        runsToday: {type: integer}
        maxPerDay: {type: integer}
        minIntervalMs: {type: integer}
        humanPriorityMs: {type: integer}
        maxLossMicro: {type: integer}
        targets:
          type: array
          description: "the markets this rule watches; the engine evaluates the rule once per target"
          items:
            type: object
            additionalProperties: true
            properties:
              marketId: {type: string}
              tokenId: {type: string}
        trigger:
          type: object
          additionalProperties: true
          description: |-
            The compiled trigger tree as the engine stores it: `all`/`any` wrapping rows of literals, or a single
            leaf. Opaque here on purpose — the builder is the only thing that edits it, and the run log is what
            explains it — but `additionalProperties: true` is stated so a client may read a leaf's own fields.
        actions:
          type: array
          description: "the engine executes the first executable row"
          items:
            type: object
            additionalProperties: true
            required: [kind]
            properties:
              kind: {type: string}
        lastRun:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/AutomationRunRow"

    AutomationTemplate:
      type: object
      required: [templateId, name, kind, trigger, actions, available, verdict, blockingReason, why, feeArithmetic]
      description: |-
        A template with the decision it carries. `available: false` is not an omission — the withheld entry
        template is listed WITH the arithmetic that withheld it, because a user deserves to read the numbers
        rather than wonder whether the feature is missing.
      properties:
        templateId: {type: string}
        name: {type: string}
        kind: {type: string}
        trigger:
          type: object
          additionalProperties: true
          description: "the template's own trigger tree, in the same shape a saved rule stores"
        actions:
          type: array
          description: "what the template does when it fires"
          items:
            type: object
            additionalProperties: true
            required: [kind]
            properties:
              kind: {type: string}
        available: {type: boolean}
        verdict: {type: string}
        blockingReason: {type: string}
        why: {type: string}
        feeArithmetic:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/FeeArithmetic"

    LossHalt:
      type: object
      required: [halted, thresholdMicro, realizedMicro, trippedMs, acknowledgeHint, note]
      description: |-
        The daily-loss halt, as the banner shows it. Read from `loss_halts` rather than recomputed: a second
        derivation of "is this account halted" is a second answer to a question that decides whether money moves.
      properties:
        halted: {type: boolean}
        thresholdMicro: {type: integer}
        realizedMicro: {type: integer, description: "signed"}
        lossMicro: {type: integer}
        trippedMs: {type: integer}
        acknowledgeHint: {type: string}
        note: {type: string}

    AlertRule:
      type: object
      required: [ruleId, kind, target, enabled, severity, channel, channelAllowed, channelNote, firesPerWindow,
                 windowMs, cooldownMs, cooldownRule, cooldownNote, firesInWindow, remainingInWindow, nextAllowedMs,
                 quietHours, digest, wouldDoNow, lastDelivery, params, engineKind, evaluated, evaluator, createdMs]
      description: |-
        One alert rule with its budget made explicit: `cooldownRule` states `firesPerWindow` per `windowMs` as
        a sentence ("3 per 1h = one every 20m at most"), and `wouldDoNow` is the plan for this instant.
      properties:
        ruleId: {type: string}
        kind: {type: string, enum: [price_level, spread_widen, whale_fill, resolve_lead, illiquid_top, new_market,
                                    manual]}
        target:
          type: object
          required: [marketId, eventId]
          description: "marketId and/or eventId; a rule with neither cannot fire"
          properties:
            marketId: {type: ["string", "null"]}
            eventId: {type: ["string", "null"]}
        enabled: {type: boolean}
        severity: {type: string, enum: [info, notice, urgent]}
        channel: {type: string, enum: [telegram, email, webhook]}
        channelAllowed: {type: boolean}
        channelNote: {type: string}
        firesPerWindow: {type: integer}
        windowMs: {type: integer}
        cooldownMs: {type: integer}
        cooldownRule: {type: string}
        cooldownNote: {type: string}
        firesInWindow: {type: integer}
        remainingInWindow: {type: integer}
        nextAllowedMs: {type: ["integer", "null"]}
        params:
          type: object
          additionalProperties: true
          description: "the user's own params, as saved — what the inline editor reopens on"
        engineKind:
          type: ["string", "null"]
          description: "the engine kind this rule is evaluated by; null means no loop is watching it"
        evaluated: {type: boolean}
        evaluator: {type: string, description: "the sentence that says whether a loop reads this rule, and which"}
        quietHours: {$ref: "#/components/schemas/QuietState"}
        digest: {$ref: "#/components/schemas/DigestState"}
        wouldDoNow: {$ref: "#/components/schemas/AlertPlan"}
        lastDelivery:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/LastDelivery"
        createdMs: {type: integer}

    QuietState:
      type: object
      required: [configured, active, untilMs, note]
      description: |-
        Quiet hours as a state: whether a window is configured at all, whether it is holding RIGHT NOW, and the
        sentence the list shows. `configured` is a separate field from `active` because "off" and "in a window that
        has not started yet" are different answers, and a screen that conflated them would tell a user their alerts
        are being held when they are not.
      properties:
        configured: {type: boolean}
        active: {type: boolean}
        untilMs: {type: ["integer", "null"]}
        note: {type: string}

    DigestState:
      type: object
      required: [mode, deferred, atMs, note]
      description: |-
        Whether this alert would be batched rather than sent, and when it would go out. `deferred` is true only when
        the digest is what holds it: an urgent alert breaches a digest, and `deferred` stays false.
      properties:
        mode: {type: string, enum: [off, hourly, daily]}
        deferred: {type: boolean}
        atMs: {type: ["integer", "null"]}
        note: {type: string}

    LastDelivery:
      type: object
      required: [channel, status, reason, atMs, title]
      description: "the newest delivery for a rule, so the list can show what happened last without a second read"
      properties:
        channel: {type: string}
        status: {type: string}
        reason: {type: string}
        atMs: {type: integer}
        title: {type: string}

    AlertDelivery:
      type: object
      required: [deliveryId, ruleId, kind, engineKind, channel, status, reason, queuedMs, sentMs, latencyMs,
                 severity, title, isTest]
      description: |-
        One channel attempt. `digest_scheduled` is held and `dropped_rate_limited` is refused by the rule's own
        cap: two different facts, kept apart so a user does not go looking for a broken channel. `isTest` marks a
        test fire, which is recorded but never counted as a real alert.
      properties:
        deliveryId: {type: integer}
        ruleId: {type: string}
        kind: {type: string, description: "the SCREEN's word for the kind, which is the vocabulary the user chose"}
        engineKind: {type: string, description: "the engine's own kind, kept beside it so a log line matches a row"}
        channel: {type: string}
        status: {type: string, enum: [queued, sent, digest_scheduled, dropped_rate_limited, failed]}
        reason: {type: string}
        queuedMs: {type: integer}
        sentMs: {type: ["integer", "null"]}
        latencyMs: {type: ["integer", "null"]}
        severity: {type: string}
        title: {type: string}
        isTest: {type: boolean}

    NotificationSettings:
      type: object
      required: [quietStartMin, quietEndMin, tzOffsetMin, digestMode, digestAtMin, defaultChannel, channels, note,
                 quietHours, digestNow]
      description: |-
        One row per account, materialised with these defaults on first read: Telegram, quiet hours OFF (-1 for
        both ends — 0 would mean midnight-to-midnight, a mute button wearing a time window's clothes), digest OFF,
        UTC until the client says where the user is. The offset is sent by the client and never guessed: a quiet
        window evaluated in the wrong timezone is a setting that silently does not work.
      properties:
        quietStartMin: {type: integer, description: "minutes past midnight in the user's offset; -1 = off"}
        quietEndMin: {type: integer}
        tzOffsetMin: {type: integer, description: "minutes east of UTC"}
        digestMode: {type: string, enum: [off, hourly, daily]}
        digestAtMin: {type: integer}
        defaultChannel: {type: string, enum: [telegram, email, webhook]}
        channels:
          type: array
          description: "each channel with the plan it needs, so a plan check is data rather than a client constant"
          items:
            type: object
            required: [channel, plan, isDefault]
            properties:
              channel: {type: string}
              plan: {type: string}
              isDefault: {type: boolean}
        quietHours: {$ref: "#/components/schemas/QuietState"}
        digestNow: {$ref: "#/components/schemas/DigestState"}
        note: {type: string}

    AlertPlan:
      type: object
      required: [channel, decision, status, sentence]
      description: |-
        What one channel would do with one alert, decided now: sent, held for quiet hours, batched into the digest,
        held by the rule's own cap, or refused because the plan does not cover the channel. One name, used both by
        the list's `wouldDoNow` and by a test fire's rows, because they are the same answer asked twice.
      properties:
        channel: {type: string}
        decision: {type: string, enum: [send_now, quiet_hours, digest, rate_limited, refused]}
        status: {type: string}
        reason: {type: string}
        atMs: {type: ["integer", "null"]}
        sentence: {type: string}

    BuilderField:
      type: object
      required: [name, label, type]
      description: |-
        One field of one trigger or action row. The builder renders these and nothing else: a row is a set of
        literals, there is no expression syntax, and this is the list of what the engine will accept.
      properties:
        name: {type: string}
        label: {type: string, description: "the word the form shows; the engine's own name is in `name`"}
        type: {type: string, description: "select | price | shares | notional | time_ms | integer | bool | text"}
        options: {type: array, items: {type: string}, description: "present on a select, and the only values it takes"}
        default: {description: "the value the row starts on, so a saved rule is never an empty string"}
        min: {type: integer}
        max: {type: integer}
        required: {type: boolean}
        help: {type: string}

    BuilderKind:
      type: object
      required: [kind, label, fields]
      properties:
        kind: {type: string}
        label: {type: string}
        fields:
          type: array
          items: {$ref: "#/components/schemas/BuilderField"}

    BuilderVocabulary:
      type: object
      required: [triggers, actions, joiners, limits, note]
      description: |-
        Everything the visual builder needs to render itself, including the limits it enforces. Both halves of the
        form are here — "when" and "then" — because the builder is one form and a vocabulary split across two
        reads is a form that can render half of itself.
      properties:
        triggers:
          type: array
          items: {$ref: "#/components/schemas/BuilderKind"}
        actions:
          type: array
          items: {$ref: "#/components/schemas/BuilderKind"}
        joiners:
          type: object
          additionalProperties: {type: string}
          description: |-
            The AND/OR grouping the rows may use, as a map of the engine's own key to the word the form shows
            (`{all: AND, any: OR}`). A map rather than a list because the word is copy and the key is the engine's:
            a client that hard-coded "AND" would be a second place the vocabulary lives.
        limits:
          type: object
          required: [maxLeaves, maxNestDepth, minIntervalMs, maxRunsPerDay]
          properties:
            maxLeaves: {type: integer}
            maxNestDepth: {type: integer}
            minIntervalMs: {type: integer}
            maxRunsPerDay: {type: integer}
        note: {type: string}

    AutomationCaps:
      type: object
      required: [concurrentRuleCap, globalRunsPerDay, activeRules, note]
      description: |-
        The two caps a user meets: their own concurrent-rule cap and the platform's daily run budget. Both are
        shown because a rule that cannot run because the PLATFORM is out of budget is a different fact from one
        that hit its own cap, and a user who cannot tell them apart reports the wrong bug.
      properties:
        concurrentRuleCap: {type: integer}
        globalRunsPerDay: {type: integer}
        activeRules: {type: integer}
        note: {type: string}

    AutomationRunRow:
      type: object
      required: [ruleId, mode, outcome, reason, atMs, sentence]
      description: |-
        One evaluation. Every evaluation is a row, including the ones that did nothing: "why did the bot not act"
        is the question this surface exists to answer, and a log that only holds the actions answers the other one.
      properties:
        ruleId: {type: string}
        mode: {type: string, enum: [dry_run, live]}
        outcome: {type: string, enum: [placed, would_place, skipped, failed]}
        reason: {type: string}
        denyCode: {type: string}
        intentId: {type: string}
        atMs: {type: integer}
        leaves: {type: string, description: "the trigger's leaves with the values they held when they were read"}
        sentence: {type: string}

    AutomationList:
      type: object
      required: [rules, caps, vocabulary, note]
      description: |-
        The automation console's read: this account's rules, the halt state, the caps and the builder's vocabulary.
        One read rather than four because the form cannot be rendered or the banner decided from a partial answer.
      properties:
        rules:
          type: array
          items: {$ref: "#/components/schemas/AutomationRule"}
        halt:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/LossHalt"
        caps: {$ref: "#/components/schemas/AutomationCaps"}
        vocabulary: {$ref: "#/components/schemas/BuilderVocabulary"}
        note: {type: string}

    TemplateCatalog:
      type: object
      required: [templates, ships, verdict, why]
      description: |-
        The template catalog with the arithmetic that decides it. Kept as a name so the screen that renders it (the
        "start from a template" panel) reads the same shape the API promises.
      properties:
        templates:
          type: array
          items: {$ref: "#/components/schemas/AutomationTemplate"}
        feeArithmetic:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/FeeArithmetic"
        ships: {type: boolean}
        verdict: {type: string}
        why: {type: string}
        blockingReason: {type: string}

    FeeArithmetic:
      type: object
      description: |-
        The numbers behind the entry verdict: the fee actually charged per share, the cost of crossing the spread,
        what our own latency adds, and the edge that has to clear all three. `edgeAvailableBp` is a MEASUREMENT, so
        it is null when nothing measured it — the response says so rather than inventing a flattering number.
      properties:
        feeType: {type: ["string", "null"]}
        feeRateBps: {type: ["integer", "null"]}
        maker: {type: ["boolean", "null"]}
        legs: {type: ["integer", "null"]}
        priceMicro: {type: ["integer", "null"]}
        breakEvenWinRateBp: {type: ["integer", "null"]}
        impliedProbBp: {type: ["integer", "null"]}
        feesPerShareMicro: {type: ["integer", "null"]}
        spreadCostMicro: {type: ["integer", "null"]}
        spreadCostBp: {type: ["integer", "null"]}
        latencyMs: {type: ["integer", "null"]}
        latencyCostBp: {type: ["integer", "null"]}
        edgeNeededBp: {type: ["integer", "null"]}
        edgeAvailableBp: {type: ["integer", "null"]}
        builderBps: {type: ["integer", "null"]}
        assumptions: {type: ["string", "null"]}

    AlertsList:
      type: object
      required: [rules, settings, plan, ruleCount, note]
      description: |-
        The alert list as one name, so a front end derives its type from the contract instead of transcribing the
        shape by hand — and the transcription is the thing that drifts.
      properties:
        rules:
          type: array
          items: {$ref: "#/components/schemas/AlertRule"}
        settings: {$ref: "#/components/schemas/NotificationSettings"}
        plan: {type: string, description: "the plan the channel checks read"}
        ruleCount: {type: integer}
        note: {type: string}

    LeaderboardMoney:
      description: |-
        USDC as a dot-decimal string — signed where the number can be negative (realised PnL, improvement,
        a drawdown). The integer `…Micro` field beside every one of these is the number the ranking is defined
        against; the string is what the number layer renders.
      type: string
      pattern: '^-?[0-9]+(\.[0-9]{1,6})?$'
      examples: ["26800", "-1200.5", "0"]

    LeaderboardRankBadge:
      type: object
      required: [rank, rankedTotal, text]
      properties:
        rank: {type: integer, minimum: 1}
        rankedTotal: {type: integer, minimum: 0}
        text: {type: string, examples: ["#47"]}

    LeaderboardComponents:
      type: object
      required: [scaleMicro, trimRemovedMicro, volatilityMultiple, formula, trimRule]
      description: every term of the score, so a user can recompute their own rank with arithmetic
      properties:
        scaleMicro: {type: integer, minimum: 1, description: "max(largest drawdown, N x sigma) — the denominator"}
        trimRemovedMicro: {type: integer, minimum: 0, description: "what excluding the single best market removed"}
        volatilityMultiple: {type: integer, minimum: 1}
        formula: {type: string}
        trimRule: {type: string}

    LeaderboardRow:
      type: object
      required: [rank, anon, scoreBps, state, labels, settledMarkets, wins, winRateBps, insufficientSample,
                 sampleNote, realisedMicro, trimmedMicro, volatilityMicro, maxDrawdownMicro, bestTradeShareBps,
                 ageDays, verifiedVolumeMicro, volumeWindow, washedMicro, washNote, copiers, disputedExcluded,
                 board, components, anon, realised, trimmed, volatility, drawdown, verifiedVolume, washed,
                 rankBadge, classifications]
      description: |-
        One ranked wallet. `state` is `ranked`, `provisional` or `blew_up`, and a blown-up wallet keeps its real
        (negative) score: quietly dropping blown-up accounts is how a leaderboard lies. `volumeWindow` says which
        window `verifiedVolumeMicro` was measured over — the volume board ranks its window, every skill board's
        eligibility floor is written in LIFETIME turnover, and a row that did not say which would be unreadable.
      properties:
        rank: {type: integer, minimum: 1}
        anon: {type: string, description: "the wallet's pseudonym; an address never leaves the API"}
        board: {type: string}
        scoreBps: {type: integer}
        state: {type: string, enum: [ranked, provisional, blew_up]}
        labels: {type: array, items: {type: string}, description: "each label states its own rule"}
        settledMarkets: {type: integer, minimum: 0}
        wins: {type: integer, minimum: 0}
        winRateBps: {type: integer}
        insufficientSample: {type: boolean}
        sampleNote: {type: string}
        realisedMicro: {type: integer}
        trimmedMicro: {type: integer}
        volatilityMicro: {type: integer, minimum: 0}
        maxDrawdownMicro: {type: integer, minimum: 0}
        bestTradeShareBps: {type: integer, minimum: 0, maximum: 10000}
        ageDays: {type: integer, minimum: 0}
        verifiedVolumeMicro: {type: integer, minimum: 0}
        volumeWindow: {type: string, description: "the window the turnover was measured over, or `lifetime`"}
        washedMicro: {type: integer, minimum: 0}
        washNote: {type: string}
        copiers: {type: integer, minimum: 0}
        disputedExcluded: {type: integer, minimum: 0}
        improvementMicro: {type: integer}
        weekMicro: {type: integer}
        priorWeekMicro: {type: integer}
        windowSettledMarkets: {type: integer, minimum: 0, description: "the rising board's 7-day half: how many of `settledMarkets` fell inside the window being measured"}
        category: {type: [string, "null"]}
        categoryShareBps: {type: integer, minimum: 0, maximum: 10000}
        categorySettled: {type: integer, minimum: 0}
        components: {$ref: "#/components/schemas/LeaderboardComponents"}
        realised: {$ref: "#/components/schemas/LeaderboardMoney"}
        trimmed: {$ref: "#/components/schemas/LeaderboardMoney"}
        volatility: {$ref: "#/components/schemas/LeaderboardMoney"}
        drawdown: {$ref: "#/components/schemas/LeaderboardMoney"}
        verifiedVolume: {$ref: "#/components/schemas/LeaderboardMoney"}
        washed: {$ref: "#/components/schemas/LeaderboardMoney"}
        improvement: {$ref: "#/components/schemas/LeaderboardMoney"}
        week: {$ref: "#/components/schemas/LeaderboardMoney"}
        priorWeek: {$ref: "#/components/schemas/LeaderboardMoney"}
        rankBadge: {$ref: "#/components/schemas/LeaderboardRankBadge"}
        classifications:
          type: array
          description: the behaviour labels the trader dossier carries, each with its rule and disclaimer
          items:
            type: object
            required: [label, rule, disclaimer]
            properties:
              label: {type: string}
              rule: {type: string}
              disclaimer: {type: string}

    LeaderboardUnranked:
      type: object
      required: [anon, reasons, settledMarkets, verifiedVolumeMicro, verifiedVolume, washedMicro, washed,
                 washNote, note, classifications]
      description: |-
        Why a wallet is NOT on the board, with the number that refused it. A leaderboard that hides its refusals
        is a leaderboard nobody can audit; this list is part of the response, not an empty page.
      properties:
        anon: {type: string}
        reasons: {type: array, items: {type: string}}
        settledMarkets: {type: integer, minimum: 0}
        verifiedVolumeMicro: {type: integer, minimum: 0}
        verifiedVolume: {$ref: "#/components/schemas/LeaderboardMoney"}
        washedMicro: {type: integer, minimum: 0}
        washed: {$ref: "#/components/schemas/LeaderboardMoney"}
        washNote: {type: string}
        note: {type: string}
        classifications: {type: array, items: {type: object}}

    LeaderboardSummary:
      type: object
      required: [rankedTotal, unrankedTotal, blewUpCount, provisionalCount, disputedWithheld, washedMicro,
                 settledMarkets, excludedTotal, medianSettledMarkets, note]
      description: counts over the WHOLE board, never over the page
      properties:
        rankedTotal: {type: integer, minimum: 0}
        unrankedTotal: {type: integer, minimum: 0}
        blewUpCount: {type: integer, minimum: 0}
        provisionalCount: {type: integer, minimum: 0}
        disputedWithheld: {type: integer, minimum: 0}
        washedMicro: {type: integer, minimum: 0}
        settledMarkets: {type: integer, minimum: 0}
        excludedTotal: {type: integer, minimum: 0, description: "wallets an operator has removed from this board"}
        medianSettledMarkets: {type: integer, minimum: 0}
        filteredTotal: {type: [integer, "null"]}
        note: {type: string}

    LeaderboardPage:
      type: object
      required: [limit, offset, returned, unrankedReturned, rankedTotal, hasMore, filtered]
      properties:
        limit: {type: integer, minimum: 1}
        offset: {type: integer, minimum: 0}
        returned: {type: integer, minimum: 0}
        unrankedReturned: {type: integer, minimum: 0}
        rankedTotal: {type: integer, minimum: 0}
        hasMore: {type: boolean}
        filtered: {type: boolean}

    LeaderboardReadPlan:
      type: object
      required: [board, window, atMs, windowMs, settledFromMs, fillsFromMs, settledRule, fillsRule]
      description: which rows this board was ranked from, as of when — the first question in any ranking dispute
      properties:
        board: {type: string}
        window: {type: string}
        atMs: {type: integer, description: "the instant the window starts were derived from"}
        windowMs: {type: integer, minimum: 0}
        settledFromMs: {type: integer, minimum: 0}
        fillsFromMs: {type: integer, minimum: 0}
        settledRule: {type: string}
        fillsRule: {type: string}

    LeaderboardFreshness:
      type: object
      required: [board, label, snapshotMs, ageMs, cadenceMs, runs, stale, source, note]
      properties:
        board: {type: string}
        label: {type: string}
        snapshotMs: {type: [integer, "null"]}
        ageMs: {type: [integer, "null"]}
        cadenceMs: {type: integer, minimum: 0}
        runs: {type: integer, minimum: 0}
        stale: {type: boolean}
        source: {type: string, description: "`live` — the board is ranked from the ledger on every read"}
        note: {type: string}

    LeaderboardBoardSpec:
      type: object
      required: [id, label, isDefault, kind, window, windows, formula, gate, cadenceMs, cadence, categoryBoard,
                 categories]
      properties:
        id: {type: string}
        label: {type: string}
        isDefault: {type: boolean}
        kind: {type: string, enum: [skill, activity, social]}
        window: {type: string}
        windows: {type: array, items: {type: string}}
        formula: {type: string}
        gate: {type: string}
        cadenceMs: {type: integer, minimum: 0}
        cadence: {type: string}
        categoryBoard: {type: boolean}
        categories: {type: array, items: {type: string}}
        tieBreaks: {type: string}
        rewards: {type: string}
        punishes: {type: string}
        note: {type: string}

    LeaderboardBoards:
      type: object
      required: [boards, defaultBoard, categories, note]
      properties:
        boards: {type: array, items: {$ref: "#/components/schemas/LeaderboardBoardSpec"}}
        defaultBoard: {type: string}
        categories: {type: array, items: {type: string}}
        note: {type: string}

    LeaderboardIntegrityRule:
      type: object
      required: [id, label, does, doesNot, detect]
      properties:
        id: {type: string}
        label: {type: string}
        does: {type: string}
        doesNot: {type: string, description: "every rule states what it does NOT do — a filter that labels a wallet is a different product from one that hides it"}
        detect: {type: string}

    LeaderboardMethodology:
      type: object
      required: [boards, defaultBoard, sampleGate, minVerifiedVolumeMicro, provisionalDays, luckyTradeShareBps,
                 volatilityMultiple, integrity, note, path, windows, readPath, launchList, excludedWallets]
      properties:
        boards: {type: array, items: {$ref: "#/components/schemas/LeaderboardBoardSpec"}}
        defaultBoard: {type: string}
        sampleGate: {type: integer, minimum: 1}
        minVerifiedVolumeMicro: {type: integer, minimum: 0}
        provisionalDays: {type: integer, minimum: 1}
        luckyTradeShareBps: {type: integer, minimum: 0, maximum: 10000}
        volatilityMultiple: {type: integer, minimum: 1}
        integrity: {type: array, items: {$ref: "#/components/schemas/LeaderboardIntegrityRule"}}
        windows: {type: object, description: "per board+window: the read plan the engine was handed"}
        readPath: {type: string}
        path: {type: string}
        launchList: {type: array, items: {type: object}}
        excludedWallets: {type: string}
        note: {type: string}

    LeaderboardWhy:
      type: object
      required: [board, window, why, a, b, components, note, sampleGate, unranked]
      properties:
        board: {type: string}
        window: {type: string}
        why: {type: string, description: "one sentence, with both metrics and both sample sizes"}
        a: {$ref: "#/components/schemas/LeaderboardRow"}
        b: {$ref: "#/components/schemas/LeaderboardRow"}
        components:
          type: object
          required: [a, b]
          properties:
            a: {$ref: "#/components/schemas/LeaderboardComponents"}
            b: {$ref: "#/components/schemas/LeaderboardComponents"}
        note: {type: string}
        sampleGate: {type: integer, minimum: 1}
        unranked: {type: array, items: {type: object}}

    LeaderboardSnapshotPoint:
      type: object
      required: [tsMs, rank, scoreBps, settledMarkets, maxDrawdownMicro, maxDrawdown]
      properties:
        tsMs: {type: integer}
        rank: {type: integer, minimum: 1}
        scoreBps: {type: integer}
        settledMarkets: {type: integer, minimum: 0}
        maxDrawdownMicro: {type: integer, minimum: 0}
        maxDrawdown: {$ref: "#/components/schemas/LeaderboardMoney"}

    LeaderboardSnapshotBoard:
      type: object
      required: [board, label, window, points, latestRank, bestRank, worstRank, delta, note]
      properties:
        board: {type: string}
        label: {type: string}
        window: {type: string}
        points: {type: array, items: {$ref: "#/components/schemas/LeaderboardSnapshotPoint"}}
        latestRank: {type: integer, minimum: 1}
        bestRank: {type: integer, minimum: 1}
        worstRank: {type: integer, minimum: 1}
        delta: {type: integer, description: "change in RANK; negative is an improvement"}
        note: {type: string}

    LeaderboardSnapshots:
      type: object
      required: [anon, days, boards, snapshots, note]
      properties:
        anon: {type: string}
        days: {type: integer, minimum: 1}
        boards: {type: array, items: {$ref: "#/components/schemas/LeaderboardSnapshotBoard"}}
        snapshots: {type: integer, minimum: 0}
        note: {type: string}

    LeaderboardRunRow:
      type: object
      required: [board, label, window, ranked, unranked, blewUp, durationMs, computedMs]
      description: |-
        One recompute: how many wallets ranked, how many were refused, how long it took. `window` is the board's
        run key, which for the category board is the window plus its category (`30d:Politics`) — the board is
        four boards in one, and a key without the category would collapse four runs into one row.
      properties:
        board: {type: string}
        label: {type: string}
        window: {type: string}
        ranked: {type: integer, minimum: 0}
        unranked: {type: integer, minimum: 0}
        blewUp: {type: integer, minimum: 0}
        durationMs: {type: integer, minimum: 0}
        computedMs: {type: integer}

    LeaderboardRuns:
      type: object
      required: [rows, freshness, cadences]
      properties:
        rows: {type: array, items: {$ref: "#/components/schemas/LeaderboardRunRow"}}
        freshness:
          type: object
          additionalProperties: {$ref: "#/components/schemas/LeaderboardFreshness"}
        cadences:
          type: object
          additionalProperties: {type: integer, minimum: 0}

    LeaderboardRecompute:
      type: object
      required: [runs, snapshots, integrity, computedMs, bucketHour, boards, note]
      properties:
        runs:
          type: array
          items:
            type: object
            required: [board, window, category, ranked, unranked, blewUp, disputedWithheld, durationMs]
            properties:
              board: {type: string}
              window: {type: string}
              category: {type: [string, "null"]}
              ranked: {type: integer, minimum: 0}
              unranked: {type: integer, minimum: 0}
              blewUp: {type: integer, minimum: 0}
              disputedWithheld: {type: integer, minimum: 0}
              durationMs: {type: integer, minimum: 0}
        snapshots: {type: integer, minimum: 0}
        integrity: {type: integer, minimum: 0}
        computedMs: {type: integer}
        bucketHour: {type: integer}
        boards: {type: array, items: {type: string}}
        window: {type: [string, "null"]}
        note: {type: string}

    LeaderboardBoard:
      type: object
      required: [board, label, window, windows, category, categories, formula, gate, tieBreaks, cadence,
                 cadenceMs, note, rows, unranked, summary, page, boards, readPlan, freshness, methodologyPath,
                 excludedTotal, excluded, disclaimer]
      properties:
        board: {type: string}
        label: {type: string}
        window: {type: string}
        windows: {type: array, items: {type: string}}
        category: {type: [string, "null"]}
        categories: {type: array, items: {type: string}}
        formula: {type: string}
        gate: {type: string}
        tieBreaks: {type: string}
        cadence: {type: string}
        cadenceMs: {type: integer, minimum: 0}
        note: {type: string}
        rows: {type: array, items: {$ref: "#/components/schemas/LeaderboardRow"}}
        unranked: {type: array, items: {$ref: "#/components/schemas/LeaderboardUnranked"}}
        summary: {$ref: "#/components/schemas/LeaderboardSummary"}
        page: {$ref: "#/components/schemas/LeaderboardPage"}
        boards: {type: array, items: {$ref: "#/components/schemas/LeaderboardBoardSpec"}}
        readPlan: {$ref: "#/components/schemas/LeaderboardReadPlan"}
        freshness: {$ref: "#/components/schemas/LeaderboardFreshness"}
        methodologyPath: {type: string}
        excludedTotal: {type: integer, minimum: 0}
        excluded:
          type: [array, "null"]
          description: operator-only (admin token); null for a public caller, because a wall of shame is a different product from a leaderboard
          items: {type: object}
        disclaimer: {type: string}

  responses:
    NotFound:
      description: no such resource
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Denied:
      description: refused by policy or by the venue feed's state
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: idempotency key reused with a different body, or a market that cannot accept orders
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Validation:
      description: request rejected before any money logic ran
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    RateLimited:
      description: >-
        the account's budget for this operation is spent. `QUOTA_EXCEEDED` carries the plan, the numbers used,
        and the fact that a cached repeat is free - a 429 that says only "spent" leaves the user unable to tell
        whether the next scan costs anything.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Internal:
      description: unexpected failure (logged with the request id; the body never says why)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
