  /v1/auth/totp/verify:
    post:
      tags:
      - auth
      summary: Verify a 6-digit code (and consume its window)
      description: 'RFC 6238 with one step of leeway, a five-try budget per enrolment, and single-use steps: a correct
        code for a step already accepted is `reused`, not `ok`. The distinction is the difference between "the user
        mistyped" and "somebody watched the user type it", and the second one needs an event. '
      operationId: totpVerify
      x-auth: user
