  /v1/auth/sessions/revoke:
    post:
      tags:
      - auth
      summary: Revoke one of this account's sessions, or all of them
      description: 'Object-level authorisation in the WHERE clause: the row is looked up by (id, user), so somebody
        else''s session id is a miss rather than a 403. A session id is a lockout primitive if that comparison is
        missing, and a body that guesses the shape of a foreign id gets the same answer as one that guesses wrong
        about a real one. '
      operationId: revokeSession
      x-auth: user-owns-resource
      x-rate-class: auth
      x-cache: no-store
      x-idempotency-exempt: 'revocation converges: two calls for the same session end one session and write one event'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
