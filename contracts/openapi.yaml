openapi: 3.1.0
# P04 D4 · the contract the web app codes against, and the only description of the API that is checked
# against the implementation (tools/check-openapi.py + tests/test_openapi.py).
#
# Global rules, stated once here rather than in prose:
#   1. Every mutating endpoint requires `Idempotency-Key` and answers 400 without it. No exceptions, no
#      "safe" POSTs: an endpoint that is POST but "idempotent by luck" is how a retry double-spends.
#   2. Money and prices are DECIMAL STRINGS, never JSON numbers. The schema says `type: string` with a
#      pattern; that is a machine-checkable version of "no floats in the money path".
#   3. Every read payload carries `asOf` (ms) and `staleAfter` (ms). A price without a timestamp is a rumour.
#   4. Every error uses the one envelope in `components.schemas.Error`, with a user-safe `message`.
#   5. `/v1/` prefix on everything, so a breaking change is a new prefix and not a surprise.
info:
  # The product is called Openout (P02 chose it); the repo and the PGM_* env prefix are the working name and
  # stay, because churning env names mid-build trades one clarity for five outages.
  title: Openout API
  version: "1.0.0"
  description: |
    Read endpoints are public or user-scoped. Trading endpoints are user-scoped and risk-gated: a 202 here
    means "queued for the executor", never "accepted at the venue". Trading is refused with 503 while the
    venue feed is disconnected or the kill switch is engaged (P01 constraint; `retryable: true`).
  license: {name: Proprietary}
servers:
  - url: /
    description: same-origin in dev (vite proxies); https://api.openout.app in production

tags:
  - name: health
  - name: market
  - name: trading
  - name: leaderboard
  - name: admin

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness
      description: Never touches Postgres/Redis. A pod that is not READY must not also be declared DEAD, or
        the fleet restart-storms during an upstream outage.
      operationId: healthz
      x-auth: none
      x-rate-class: unauthenticated
      x-cache: no-store
      responses:
        "200":
          description: process answers
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties: {ok: {type: boolean, const: true}}

  /readyz:
    get:
      tags: [health]
      summary: Readiness
      description: |
        Reports the database and whether the flag store is still on BOOT DEFAULTS. The second one matters: a
        pod serving traffic on defaults during an incident looks healthy and behaves like a different
        product (it has no kill-switch flag, no rate caps, no staged features).
      operationId: readyz
      x-auth: none
      x-rate-class: unauthenticated
      x-cache: no-store
      responses:
        "200":
          description: ready
          content:
            application/json:
              schema:
                type: object
                required: [ready, problems]
                properties:
                  ready: {type: boolean}
                  problems:
                    type: array
                    items: {type: string, enum: [db_unreachable, flags_from_defaults, venue_disconnected]}
        "503":
          description: not ready (same body; the status is what the orchestrator reads)
          content:
            application/json:
              schema:
                type: object
                required: [ready, problems]
                properties:
                  ready: {type: boolean, const: false}
                  problems: {type: array, items: {type: string}}
        "500": {$ref: "#/components/responses/Internal"}

  /v1/markets/{market_id}:
    get:
      tags: [market]
      summary: Market header (one request, cached; never re-fetched on tape events)
      operationId: getMarket
      x-auth: none
      x-rate-class: public-read
      x-cache: shared, ttl 1000ms, serve-stale 30s
      parameters:
        # Path parameters keep the app's Python spelling, because a path parameter CANNOT be aliased: FastAPI
        # takes the name from the {placeholder}. Query parameters are camelCase because those are aliased.
        - name: market_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        "200":
          description: market metadata
          headers:
            x-request-id: {$ref: "#/components/headers/xRequestId"}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [market]
                    properties: {market: {$ref: "#/components/schemas/Market"}}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/Internal"}

  /v1/markets/{market_id}/book:
    get:
      tags: [market]
      summary: Order-book ladder, aggregate by price level
      description: |
        Served from the ingest service's materialised snapshot, never proxied to the venue per request: one user must
        not be able to spend the shared rate budget (P04 rule 2). `bids` and `asks` are BOTH best-first, so
        the ladder's depth bar can render without re-sorting. A market with no book returns 404 rather than
        two empty arrays — an empty array would render as "no liquidity", which is a different claim.
      operationId: getBook
      x-auth: none
      x-rate-class: public-read
      x-cache: shared, ttl 250ms
      parameters:
        - name: market_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: depth
          in: query
          description: >-
            levels per side; 400 is the design-system ladder cap and is also the hard maximum. The limit is
            applied to the RAW ladder before aggregation, so a bucket count can be lower than `depth` - the
            alternative is loading the whole book into memory to count it, which is the cost this endpoint
            exists to avoid.
          schema: {type: integer, minimum: 1, maximum: 400, default: 24}
        - name: aggregate
          in: query
          description: >-
            bucket width for the ladder. A 0.001-tick market has a thousand levels per dollar, so the raw
            ladder is unreadable; 1c and 5c fold it. Rounding is DIRECTIONAL - a bid rounds down and an ask
            rounds up - so an aggregated level never shows a price the user could not have got.
          schema: {type: string, enum: [raw, 1c, 5c], default: raw}
      responses:
        "200":
          description: book snapshot
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [market, bids, asks, spreadTicks, ageMs, aggregate, oneSided]
                    properties:
                      market: {type: string}
                      bids: {$ref: "#/components/schemas/Levels"}
                      asks: {$ref: "#/components/schemas/Levels"}
                      aggregate: {type: string, enum: [raw, 1c, 5c]}
                      aggregateStep: {oneOf: [{$ref: "#/components/schemas/Price"}, {type: "null"}]}
                      tickSize: {oneOf: [{$ref: "#/components/schemas/Price"}, {type: "null"}]}
                      bestBid: {$ref: "#/components/schemas/Price"}
                      bestAsk: {$ref: "#/components/schemas/Price"}
                      midPrice: {$ref: "#/components/schemas/Price"}
                      maxCumShares:
                        type: string
                        description: the largest cumulative size on either side, so a depth bar can be a
                          fraction of it without the chart summing the ladder itself
                      spreadTicks:
                        oneOf: [{type: number}, {type: "null"}]
                        description: metadata arithmetic on integers, never a float price
                      oneSided:
                        oneOf:
                          - type: "null"
                          - type: object
                            required: [side, why, levels, notionalUsdc]
                            description: >-
                              present when one side of the book is empty. It is a STATE, not an error: P01
                              measured a live market with 94 ask levels at 0.001 totalling $21.9M and zero
                              bids - the holders of the other side had left. Rendering that as a broken feed
                              tells the user the market is broken when it is simply finished.
                            properties:
                              side: {type: string, enum: [asks-only, bids-only]}
                              why: {type: string, description: a machine code; the client owns the words}
                              levels: {type: integer}
                              notionalUsdc: {$ref: "#/components/schemas/Price"}
                              bestAsk: {$ref: "#/components/schemas/Price"}
                              bestBid: {$ref: "#/components/schemas/Price"}
                      ageMs: {type: integer, minimum: 0}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
        "500": {$ref: "#/components/responses/Internal"}

  /v1/markets/{market_id}/history:
    get:
      tags: [market]
      summary: Trade-derived candles for the price chart
      description: |
        Candles from OUR fills, not the venue's `/prices-history`: the venue's series samples mid-price on its
        own schedule and is Cloudflare-cached (measured in P01), so it is a different object with the same
        name. Consequences are stated rather than implied - a bucket with no fills is a GAP with `trades: 0`,
        not a flat candle, and `sampled` says when the 20k-fill read cap was reached.

        The server builds 1m, 5m, 15m and 1h. 6h and 1d are derived by the client by bucketing the 1h
        candles, and both lists are served so a client feature-detects instead of trusting a changelog.
      operationId: getMarketHistory
      x-auth: none
      x-rate-class: public-read
      x-cache: shared, ttl 250ms
      parameters:
        - name: market_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: interval
          in: query
          schema: {type: string, enum: [1m, 5m, 15m, 1h], default: 1m}
        - name: limit
          in: query
          description: buckets of history, counted back from now; it bounds the fill read as well as the output
          schema: {type: integer, minimum: 2, maximum: 1000, default: 200}
      responses:
        "200":
          description: candles, oldest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [market, interval, bucketMs, candles, serverIntervals, derivedIntervals, source]
                    properties:
                      market: {type: string}
                      interval: {type: string}
                      bucketMs: {type: integer}
                      fromTs: {type: integer, description: the oldest bucket boundary the request reaches}
                      candles: {type: array, items: {$ref: "#/components/schemas/Candle"}}
                      serverIntervals: {type: array, items: {type: string}}
                      derivedIntervals: {type: array, items: {type: string}}
                      source: {type: string, enum: [fills]}
                      sampled: {type: boolean, description: the read cap was hit; the left edge is not the
                        beginning of the market}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
        "500": {$ref: "#/components/responses/Internal"}

  /v1/markets/{market_id}/holders:
    get:
      tags: [market]
      summary: Wallets we have seen trade this market, with published labels only
      description: |
        Provenance is `tape`: these are the wallets in OUR fill log, so a whale that traded before ingest
        started is invisible and a wallet that only posted unfilled orders never appears. Not the venue's
        holder list, and the rail says which one it is. Addresses are pseudonymised exactly as in `/v1/tape`
        (sha256 with a local prefix), and `insider_suspect` filters out at the join because it is not a
        publishable label.
      operationId: getMarketHolders
      x-auth: none
      x-rate-class: public-read
      x-cache: shared, ttl 1000ms
      parameters:
        - name: market_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200":
          description: holders by notional, largest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [market, holders, provenance, holderCount]
                    properties:
                      market: {type: string}
                      provenance: {type: string, enum: [tape]}
                      holderCount: {type: integer}
                      holders:
                        type: array
                        items:
                          type: object
                          required: [anonWallet, notional, fills, shareBp, labels]
                          properties:
                            anonWallet: {type: string}
                            notional: {$ref: "#/components/schemas/Price"}
                            fills: {type: integer}
                            firstSeenMs: {type: integer}
                            lastSeenMs: {type: integer}
                            shareBp: {type: integer, description: share of the tape's notional, basis points}
                            labels: {$ref: "#/components/schemas/Labels"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
        "500": {$ref: "#/components/responses/Internal"}

  /v1/events/{event_id}:
    get:
      tags: [market]
      summary: One negRisk event, every market under it, and the invariant they must satisfy
      description: |
        The 128-row table's data source. Two statements, and the difference matters:

          * `probabilitySum`/`deviation`/`tolerance` are the INVARIANT. For a negRisk event the YES prices
            partition one dollar, so the sum must be near 1 - near, because each price is only known to a
            tick and the sum of N quotes is only known to N ticks, which is exactly `tolerance`.
          * `buyAllCost`/`sellAllProceeds`/`opportunity` are the TRADABLE statement, computed from executable
            levels rather than mids: buying one of every outcome costs the sum of the best asks, selling one
            of every outcome returns the sum of the best bids. `opportunity` is null unless one of those
            crosses a dollar by more than a tick, because a screen that shouts at every 1-tick deviation
            teaches its reader to ignore it.

        A market with only one side has no mid; it is marked `summable: false` and excluded from the sum
        instead of borrowing its last trade price, which would put a stale number into a live invariant.
      operationId: getEvent
      x-auth: none
      x-rate-class: public-read
      x-cache: shared, ttl 250ms
      parameters:
        - name: event_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 400, default: 400}}
      responses:
        "200":
          description: the event and its outcomes, biggest 24h volume first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [event, outcomes, probabilitySum, deviation, tolerance, withinTolerance, opportunity]
                    properties:
                      event: {$ref: "#/components/schemas/Event"}
                      outcomes:
                        type: array
                        maxItems: 400
                        items: {$ref: "#/components/schemas/EventOutcome"}
                      probabilitySum: {oneOf: [{$ref: "#/components/schemas/Price"}, {type: "null"}]}
                      deviation: {oneOf: [{$ref: "#/components/schemas/Price"}, {type: "null"}]}
                      tolerance: {$ref: "#/components/schemas/Price"}
                      withinTolerance: {oneOf: [{type: boolean}, {type: "null"}]}
                      summableCount: {type: integer}
                      buyAllCost: {oneOf: [{$ref: "#/components/schemas/Price"}, {type: "null"}]}
                      sellAllProceeds: {oneOf: [{$ref: "#/components/schemas/Price"}, {type: "null"}]}
                      opportunity:
                        oneOf:
                          - type: "null"
                          - type: object
                            required: [kind, edge]
                            properties:
                              kind: {type: string, enum: [buy-all, sell-all]}
                              edge: {$ref: "#/components/schemas/Price"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
        "500": {$ref: "#/components/responses/Internal"}

  /v1/markets/{market_id}/fills:
    get:
      tags: [market]
      summary: The durable fill log the ingest writes (deduplicated, labelled, no addresses)
      description: |
        Separate from `/v1/tape` on purpose. `/v1/tape` answers from `tape_trades` (the P04 table the tape widget
        and the risk gate were built against); this answers from `tape_fills`, the log P05's ingest writes with
        `UNIQUE (dedupe_key)` — the rows the volume rollups, the whale percentile and the leaderboard are computed
        from. Without this read the durable tape is a table nobody serves.

        `since` is exclusive and is the VENUE's millisecond clock, exactly as in `/v1/tape`: mixing the venue's
        clock with our ingest cursor produces either a duplicate or a hole, and a hole in a fill log reads to a
        user as a suppressed trade.
      operationId: getMarketFills
      x-auth: none
      x-rate-class: public-read
      x-cache: shared, ttl 1000ms
      parameters:
        - name: market_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: since
          in: query
          description: exclusive cursor = venue ts_ms
          schema: {type: integer, minimum: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
      responses:
        "200":
          description: fills, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [market, conditionId, rows, nextCursor]
                    properties:
                      market: {type: string}
                      conditionId: {type: string, description: "what the ingest keys every table on"}
                      rows:
                        type: array
                        items: {$ref: "#/components/schemas/DurableFill"}
                      nextCursor: {type: ["integer", "null"]}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
        "500": {$ref: "#/components/responses/Internal"}

  /v1/tape:
    get:
      tags: [market]
      summary: Recent fills (REST backfill only; the live tape is WebSocket)
      description: |
        `/trades` at the venue is Cloudflare-cached, so REST can never be the live tape (measured in P01:
        14.7-33.3 fills/sec arrive over `wss://ws-subscriptions-clob.polymarket.com/ws/market`). This
        endpoint exists for the first paint and for replay after a gap; `since` is exclusive.
      operationId: getTape
      x-auth: none
      x-rate-class: public-read
      x-cache: private, no-store for authed, 500ms shared
      parameters:
        - name: marketId
          in: query
          required: true
          schema: {type: string}
        - name: since
          in: query
          description: >-
            exclusive cursor = venue exchange_ts (ms). Never our ingest clock: the venue's order of fills is
            what a user reads, and mixing clocks makes a gap look like a duplicate.
          schema: {type: integer, minimum: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 64}
      responses:
        "200":
          description: fills, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [rows, nextCursor]
                    properties:
                      rows:
                        type: array
                        maxItems: 500
                        items: {$ref: "#/components/schemas/Fill"}
                      nextCursor: {type: ["integer", "null"]}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
        "500": {$ref: "#/components/responses/Internal"}

  /v1/markets:
    get:
      tags: [market]
      summary: Market/event list (cursor-paginated; Gamma caps at 100 per page)
      description: |
        Cursor, never offset: `limit=5000` and `tag_slug` are IGNORED by Gamma (measured in P01), so a page
        size above 100 silently returns 100 and an offset walk over a changing list repeats and skips
        markets. Cursor pagination is what makes "30k markets backfilled" a bounded job.
      operationId: listMarkets
      x-auth: none
      x-rate-class: public-read
      x-cache: shared, ttl 1000ms
      parameters:
        - name: cursor
          in: query
          description: >-
            opaque `<sort key>|<id>` from the previous page. It encodes the key the rows were ordered BY, not
            the row id: paging by id while ordering by end_ts repeats one market and drops another, and a
            single-page test cannot see it. (This endpoint did exactly that for ten minutes.)
          schema: {type: ["string", "null"], maxLength: 128}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - name: live
          in: query
          description: accepting orders right now
          schema: {type: boolean, default: true}
        - name: sortBy
          in: query
          # This enum was WRONG once: it listed volume24h, which the app rejects, because volume is a P05
          # rollup and no such column exists. tests/test_api.py now requests EVERY value listed here against
          # the live app, so an aspirational enum cannot survive the phase it was written in.
          schema:
            type: string
            enum: [endsSoon, newMarket, spread, volume24h, liquidity, openInterest, move24h]
        - name: q
          in: query
          description: >-
            case-folded substring over question, slug and category, matched with instr() rather than LIKE so a
            user's own % cannot change the meaning of their own search. Three columns, not four: the prompt
            asks for tags as well, and we do not store tags - a typeahead that searches a column which does
            not exist is a docstring, not a feature.
          schema: {type: string, maxLength: 128}
        - name: category
          in: query
          description: the P09 filter vocabulary. Case-folded, canonicalised server-side, and a value outside
            the vocabulary is a 422 rather than an empty page, because "no markets match" and "you spelled
            the category wrong" are different answers.
          schema:
            type: string
            enum: [Politics, Sports, Crypto, Finance, Economics, Tech, Culture, Weather, Geopolitics, Other]
        - name: minVolume24h
          in: query
          description: micro-USDC over the last 24h, in integer micro units - a float here would be a float
            in the money path
          schema: {type: integer, minimum: 0}
        - {name: minLiquidity, in: query, schema: {type: integer, minimum: 0}}
        - {name: minOpenInterest, in: query, schema: {type: integer, minimum: 0}}
        - name: endsWithinHours
          in: query
          description: only markets whose end is between now and now+N hours. A market that already ended is
            NOT within the window, which is what stops a dead market leading the default sort.
          schema: {type: integer, minimum: 1, maximum: 87600}
        - name: newWithinHours
          in: query
          description: only markets first seen in the last N hours
          schema: {type: integer, minimum: 1, maximum: 87600}
        - {name: negRiskOnly, in: query, schema: {type: boolean, default: false}}
        - name: includeLongTail
          in: query
          description: >-
            false by default - markets under $1,000 of 24h volume are omitted and counted in
            `longTail.hiddenCount`. P01 measured a median event at $19,910/day, so the default view is what
            someone can actually trade and the long tail is one parameter away, never silently dropped.
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: a page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [items, nextCursor, pageSizeHardCap]
                    properties:
                      items: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/Market"}}
                      nextCursor: {type: ["string", "null"]}
                      sortBy: {type: string, enum: [endsSoon, newMarket, spread, volume24h, liquidity,
                        openInterest, move24h]}
                      facets:
                        type: object
                        description: >-
                          market counts per category, with every filter applied EXCEPT the category one and
                          without the cursor: a category tab that zeroes the other tabs is a tab nobody can
                          navigate back from
                        additionalProperties: {type: integer}
                      categories: {type: array, items: {type: string}}
                      longTail:
                        type: object
                        required: [includeLongTail, thresholdMicro, hiddenCount]
                        properties:
                          includeLongTail: {type: boolean}
                          thresholdMicro: {type: integer}
                          hiddenCount: {type: integer, description: left out by the filter ABOVE, not by any
                            other one}
                      sortKeys: {type: array, items: {type: string}, description: what the server accepts
                        today, so a client can feature-detect instead of guessing from a release note}
                      pageSizeHardCap:
                        type: integer
                        const: 100
                        description: >-
                          the venue's real limit, exposed so a client cannot "optimize" by requesting 5000
                          and then trusting the count
        "422": {$ref: "#/components/responses/Validation"}
        "500": {$ref: "#/components/responses/Internal"}

  /v1/orders:
    post:
      tags: [trading]
      summary: Place an order through the risk gate (202 = queued, not accepted)
      description: |
        The only mutating endpoint in P04. Sequence (docs/P04 §D5): validate → risk gate → idempotency begin
        → sign → POST once → record. The gate runs BEFORE signing; nothing is signed that has not passed it.
        A replay of the same key returns the stored answer verbatim, including this 202 body.
      operationId: placeOrder
      x-auth: user
      x-rate-class: trading
      x-cache: no-store
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [marketId, tokenId, side, price, size]
              properties:
                marketId: {type: string, minLength: 1, maxLength: 128}
                tokenId: {type: string, minLength: 1, maxLength: 128}
                side: {type: string, enum: [BUY, SELL], description: uppercase; the venue is case-sensitive}
                price: {$ref: "#/components/schemas/Price"}
                size:
                  description: >-
                    shares as a decimal string; must be >= the market's minimum_order_size (5, measured in
                    P01) and a multiple of the market's tick when multiplied out
                  type: string
                  pattern: '^[0-9]+(\.[0-9]{1,6})?$'
                  maxLength: 24
      responses:
        '401':
          description: >-
            P07: no session. `POST /v1/orders` is `user`, and the identity comes from the bearer token
            it carries — a `X-User-Id` header is a development identity that a pod configured with
            `PGM_REQUIRE_SECURITY_ENV=1` does not accept, and a header that disagrees with a valid
            session is a 403 `SESSION_MISMATCH`, never a preference for whichever one is easier.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "202":
          description: queued for the executor
          headers:
            x-request-id: {$ref: "#/components/headers/xRequestId"}
            x-risk-latency-ms:
              description: gate latency, on success AND on denial — the only way to see the gate getting slow
              schema: {type: string}
            x-risk-checks:
              description: how many checks ran before the verdict (denials stop early by design)
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                required: [intentId, state, notionalMicro, poll, asOf, staleAfter]
                properties:
                  intentId: {type: string}
                  state: {type: string, const: queued}
                  riskLatencyMs: {type: number}
                  notionalMicro: {type: integer, minimum: 0}
                  poll: {type: string, description: "the GET target for the intent's terminal state"}
                  note: {type: string}
        "400":
          description: missing or malformed Idempotency-Key (checked before any work)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
              example: {error: {code: IDEM_KEY_REQUIRED, message: "mutating endpoints require an Idempotency-Key of 8-128 chars [A-Za-z0-9_-]", retryable: false, requestId: 0123456789abcdef}}
        "403": {$ref: "#/components/responses/Denied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "402": {$ref: "#/components/responses/Denied"}
        "422": {$ref: "#/components/responses/Validation"}
        # A 500 on THIS endpoint is the one status whose handling a client must not guess: it means "the write
        # may have landed", so the correct move is to retry with the SAME Idempotency-Key. That is why
        # INTERNAL is retryable and why its message says so out loud. (500 is declared on every operation
        # here, and on every operation in services/api/app.py, so the two cannot disagree silently -
        # tools/check-openapi.py compares the two sets and /healthz is the one exception, because liveness
        # has to keep answering 200 while the database is on fire.)
        "500": {$ref: "#/components/responses/Internal"}
        "429":
          description: too many open orders; retryable
          headers: {Retry-After: {schema: {type: integer, const: 2}}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: trading disabled (kill switch, stale feed, no signer, risk service down); retryable
          headers: {Retry-After: {schema: {type: integer, const: 2}}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /v1/orders/intents/{intent_id}:
    get:
      tags: [trading]
      summary: Poll one intent
      description: |
        Scoped to the caller: another user's id yields 404, not 403, so the endpoint cannot be used to probe
        which intent ids exist. `uncertain` is a legitimate, permanent-looking state — the executor refuses
        to re-POST an order whose response was lost, and says so, rather than risk a duplicate.
      operationId: getIntent
      x-auth: user
      x-rate-class: trading-read
      x-cache: no-store
      parameters:
        - name: intent_id
          in: path
          required: true
          schema: {type: string, minLength: 16, maxLength: 64}
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: current intent state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [intentId, state]
                    properties:
                      intentId: {type: string}
                      state:
                        type: string
                        enum: [pending, rejected, queued, submitting, uncertain, submitted, cancelled]
                      riskCode: {type: ["string", "null"]}
                      venueOrderId: {type: ["string", "null"]}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/Internal"}

  /v1/admin/kill-switch:
    post:
      tags: [admin]
      summary: Engage or disengage the trading kill switch
      description: |
        Append-only history (one row per change; the current state is the newest row). A reason of 4-400
        characters is mandatory in the schema, not in a code comment, because a switch pulled without a reason
        is unreviewable. Cancelling is always permitted while engaged; placing is not — there is no endpoint
        that submits an order while the switch is on.
      operationId: killSwitch
      x-auth: admin
      x-rate-class: admin
      x-cache: no-store
      # Rule 1 ("every mutation requires Idempotency-Key") is exempted HERE, deliberately, and the exemption is
      # machine-readable because tools/check-openapi.py demands a non-empty reason for every one of them. A
      # kill switch is state-convergent: two identical POSTs make two audit rows and one outcome. Refusing to
      # ENGAGE the switch because an idempotency row was mid-flight during an incident is the worse bug.
      x-idempotency-exempt: "state-convergent toggle; duplicate rows are audit history, not money"
      parameters:
        - name: X-Admin-Token
          in: header
          required: false
          schema: {type: string}
          description: >-
            absent or empty means 503 SIGNER_UNAVAILABLE rather than a 401, so a misconfigured dev box
            cannot look like an attack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [engaged, reason]
              additionalProperties: false
              properties:
                engaged: {type: boolean}
                reason: {type: string, minLength: 4, maxLength: 400}
      responses:
        "200":
          description: new state
          content:
            application/json:
              schema:
                type: object
                required: [engaged, atMs]
                properties: {engaged: {type: boolean}, atMs: {type: integer}}
        "422":
          description: >-
            two answers, deliberately: VALIDATION when `reason` is absent (shape), BAD_REASON when it is
            present but outside 4-400 characters (the rule the DB's CHECK enforces). "Your body is wrong" and
            "say why you pulled the switch" are different advice, and the app used to collapse them.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503": {$ref: "#/components/responses/Denied"}
        "500": {$ref: "#/components/responses/Internal"}


  # --------------------------------------------------------------------------- P07 · authn, sessions, 2FA
  # P07 · the security plane. The status sets below are the app's `*_RESPONSES` tables transcribed, 500
  # included, because `tools/check-openapi.py` requires the two sets to be EQUAL: a contract that forgets
  # the global handler is a client that does not handle it, and a table that gains a status in code has to
  # gain it here in the same commit or the gate says so.
  /v1/auth/login:
    post:
      tags:
      - auth
      summary: Exchange a password for a short session and a single-use refresh token
      description: 'Argon2id, with the parameters read back out of the stored hash: a credential minted under a weaker
        setting is re-hashed on a successful login, so the upgrade happens while we hold the plaintext. A wrong identifier
        and a wrong password return the same body, for the same time, because a login form that says "no such account"
        is a user-enumeration API. Ten failures in fifteen minutes closes the door on the account; the per-IP budget
        lives in the ingest rate limiter, where a spray actually hurts. '
      operationId: authLogin
      x-auth: public
      x-rate-class: auth
      x-cache: no-store
      x-idempotency-exempt: a login mints a new session by design; two logins are two devices, not a duplicate mutation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - identifier
              - password
              properties:
                identifier:
                  type: string
                  minLength: 3
                  maxLength: 200
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
      responses:
        '200':
          description: see the summary; every field is derived from a row, no token material
        '401':
          description: no bearer session, or the session ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: the session is fine; the action needs more
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: the body is not the shape this route takes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: too many attempts against this credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: the global handler answered with the envelope and a request id; nothing in this route may answer
            outside that envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: the security backend is not configured here
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Rotate a refresh token for a new pair (reuse of a spent token kills the family)
      description: 'The refresh token is single-use. Presenting a spent token is not a retry, it is the signature
        of a thief who has a copy of it, and the response is to revoke the whole family: the attacker''s token and
        the victim''s new one, plus an `auth_events` row the alarm reads. The token itself is never stored, only its
        SHA-256, so a read of this table cannot mint a session. '
      operationId: authRefresh
      x-auth: public
      x-rate-class: auth
      x-cache: no-store
      x-idempotency-exempt: rotation is the mutation; the single-use rule is the idempotency mechanism, and a replay
        is an alarm
      requestBody:
        required: true
