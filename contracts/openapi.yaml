openapi: 3.1.0
# P04 D4 · the contract the web app codes against, and the only description of the API that is checked
# against the implementation (tools/check-openapi.py + tests/test_openapi.py).
#
# Global rules, stated once here rather than in prose:
#   1. Every mutating endpoint requires `Idempotency-Key` and answers 400 without it. No exceptions, no
#      "safe" POSTs: an endpoint that is POST but "idempotent by luck" is how a retry double-spends.
#   2. Money and prices are DECIMAL STRINGS, never JSON numbers. The schema says `type: string` with a
#      pattern; that is a machine-checkable version of "no floats in the money path".
#   3. Every read payload carries `asOf` (ms) and `staleAfter` (ms). A price without a timestamp is a rumour.
#   4. Every error uses the one envelope in `components.schemas.Error`, with a user-safe `message`.
#   5. `/v1/` prefix on everything, so a breaking change is a new prefix and not a surprise.
info:
  # The product is called Openout (P02 chose it); the repo and the PGM_* env prefix are the working name and
  # stay, because churning env names mid-build trades one clarity for five outages.
  title: Openout API
  version: "1.0.0"
  description: |
    Read endpoints are public or user-scoped. Trading endpoints are user-scoped and risk-gated: a 202 here
    means "queued for the executor", never "accepted at the venue". Trading is refused with 503 while the
    venue feed is disconnected or the kill switch is engaged (P01 constraint; `retryable: true`).
  license: {name: Proprietary}
servers:
  - url: /
    description: same-origin in dev (vite proxies); https://api.openout.app in production

tags:
  - name: health
  - name: market
  - name: trading
  - name: admin

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness
      description: Never touches Postgres/Redis. A pod that is not READY must not also be declared DEAD, or
        the fleet restart-storms during an upstream outage.
      operationId: healthz
      x-auth: none
      x-rate-class: unauthenticated
      x-cache: no-store
      responses:
        "200":
          description: process answers
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties: {ok: {type: boolean, const: true}}

  /readyz:
    get:
      tags: [health]
      summary: Readiness
      description: |
        Reports the database and whether the flag store is still on BOOT DEFAULTS. The second one matters: a
        pod serving traffic on defaults during an incident looks healthy and behaves like a different
        product (it has no kill-switch flag, no rate caps, no staged features).
      operationId: readyz
      x-auth: none
      x-rate-class: unauthenticated
      x-cache: no-store
      responses:
        "200":
          description: ready
          content:
            application/json:
              schema:
                type: object
                required: [ready, problems]
                properties:
                  ready: {type: boolean}
                  problems:
                    type: array
                    items: {type: string, enum: [db_unreachable, flags_from_defaults, venue_disconnected]}
        "503":
          description: not ready (same body; the status is what the orchestrator reads)
          content:
            application/json:
              schema:
                type: object
                required: [ready, problems]
                properties:
                  ready: {type: boolean, const: false}
                  problems: {type: array, items: {type: string}}
        "500": {$ref: "#/components/responses/Internal"}

  /v1/markets/{market_id}:
    get:
      tags: [market]
      summary: Market header (one request, cached; never re-fetched on tape events)
      operationId: getMarket
      x-auth: none
      x-rate-class: public-read
      x-cache: shared, ttl 1000ms, serve-stale 30s
      parameters:
        # Path parameters keep the app's Python spelling, because a path parameter CANNOT be aliased: FastAPI
        # takes the name from the {placeholder}. Query parameters are camelCase because those are aliased.
        - name: market_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        "200":
          description: market metadata
          headers:
            x-request-id: {$ref: "#/components/headers/xRequestId"}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [market]
                    properties: {market: {$ref: "#/components/schemas/Market"}}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/Internal"}

  /v1/markets/{market_id}/book:
    get:
      tags: [market]
      summary: Order-book ladder, aggregate by price level
      description: |
        Served from the ingest service's materialised snapshot, never proxied to the venue per request: one user must
        not be able to spend the shared rate budget (P04 rule 2). `bids` and `asks` are BOTH best-first, so
        the ladder's depth bar can render without re-sorting. A market with no book returns 404 rather than
        two empty arrays — an empty array would render as "no liquidity", which is a different claim.
      operationId: getBook
      x-auth: none
      x-rate-class: public-read
      x-cache: shared, ttl 250ms
      parameters:
        - name: market_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: depth
          in: query
          description: levels per side; 400 is the design-system ladder cap and is also the hard maximum
          schema: {type: integer, minimum: 1, maximum: 400, default: 24}
      responses:
        "200":
          description: book snapshot
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [market, bids, asks, spreadTicks, ageMs]
                    properties:
                      market: {type: string}
                      bids: {$ref: "#/components/schemas/Levels"}
                      asks: {$ref: "#/components/schemas/Levels"}
                      bestBid: {$ref: "#/components/schemas/Price"}
                      bestAsk: {$ref: "#/components/schemas/Price"}
                      spreadTicks:
                        oneOf: [{type: number}, {type: "null"}]
                        description: metadata arithmetic on integers, never a float price
                      ageMs: {type: integer, minimum: 0}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
        "500": {$ref: "#/components/responses/Internal"}

  /v1/tape:
    get:
      tags: [market]
      summary: Recent fills (REST backfill only; the live tape is WebSocket)
      description: |
        `/trades` at the venue is Cloudflare-cached, so REST can never be the live tape (measured in P01:
        14.7-33.3 fills/sec arrive over `wss://ws-subscriptions-clob.polymarket.com/ws/market`). This
        endpoint exists for the first paint and for replay after a gap; `since` is exclusive.
      operationId: getTape
      x-auth: none
      x-rate-class: public-read
      x-cache: private, no-store for authed, 500ms shared
      parameters:
        - name: marketId
          in: query
          required: true
          schema: {type: string}
        - name: since
          in: query
          description: >-
            exclusive cursor = venue exchange_ts (ms). Never our ingest clock: the venue's order of fills is
            what a user reads, and mixing clocks makes a gap look like a duplicate.
          schema: {type: integer, minimum: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 64}
      responses:
        "200":
          description: fills, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [rows, nextCursor]
                    properties:
                      rows:
                        type: array
                        maxItems: 500
                        items: {$ref: "#/components/schemas/Fill"}
                      nextCursor: {type: ["integer", "null"]}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Validation"}
        "500": {$ref: "#/components/responses/Internal"}

  /v1/markets:
    get:
      tags: [market]
      summary: Market/event list (cursor-paginated; Gamma caps at 100 per page)
      description: |
        Cursor, never offset: `limit=5000` and `tag_slug` are IGNORED by Gamma (measured in P01), so a page
        size above 100 silently returns 100 and an offset walk over a changing list repeats and skips
        markets. Cursor pagination is what makes "30k markets backfilled" a bounded job.
      operationId: listMarkets
      x-auth: none
      x-rate-class: public-read
      x-cache: shared, ttl 1000ms
      parameters:
        - name: cursor
          in: query
          description: >-
            opaque `<sort key>|<id>` from the previous page. It encodes the key the rows were ordered BY, not
            the row id: paging by id while ordering by end_ts repeats one market and drops another, and a
            single-page test cannot see it. (This endpoint did exactly that for ten minutes.)
          schema: {type: ["string", "null"], maxLength: 128}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - name: live
          in: query
          description: accepting orders right now
          schema: {type: boolean, default: true}
        - name: sortBy
          in: query
          # This enum was WRONG once: it listed volume24h, which the app rejects, because volume is a P05
          # rollup and no such column exists. tests/test_api.py now requests EVERY value listed here against
          # the live app, so an aspirational enum cannot survive the phase it was written in.
          schema:
            type: string
            enum: [endsSoon, newMarket, spread]
        - name: q
          in: query
          description: case-folded substring over question and slug, matched with instr() rather than LIKE so
            a user's own % cannot change the meaning of their own search
          schema: {type: string, maxLength: 128}
      responses:
        "200":
          description: a page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [items, nextCursor, pageSizeHardCap]
                    properties:
                      items: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/Market"}}
                      nextCursor: {type: ["string", "null"]}
                      sortBy: {type: string, enum: [endsSoon, newMarket, spread]}
                      sortKeys: {type: array, items: {type: string}, description: what the server accepts
                        today, so a client can feature-detect instead of guessing from a release note}
                      pageSizeHardCap:
                        type: integer
                        const: 100
                        description: >-
                          the venue's real limit, exposed so a client cannot "optimize" by requesting 5000
                          and then trusting the count
        "422": {$ref: "#/components/responses/Validation"}
        "500": {$ref: "#/components/responses/Internal"}

  /v1/orders:
    post:
      tags: [trading]
      summary: Place an order through the risk gate (202 = queued, not accepted)
      description: |
        The only mutating endpoint in P04. Sequence (docs/P04 §D5): validate → risk gate → idempotency begin
        → sign → POST once → record. The gate runs BEFORE signing; nothing is signed that has not passed it.
        A replay of the same key returns the stored answer verbatim, including this 202 body.
      operationId: placeOrder
      x-auth: user
      x-rate-class: trading
      x-cache: no-store
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [marketId, tokenId, side, price, size]
              properties:
                marketId: {type: string, minLength: 1, maxLength: 128}
                tokenId: {type: string, minLength: 1, maxLength: 128}
                side: {type: string, enum: [BUY, SELL], description: uppercase; the venue is case-sensitive}
                price: {$ref: "#/components/schemas/Price"}
                size:
                  description: >-
                    shares as a decimal string; must be >= the market's minimum_order_size (5, measured in
                    P01) and a multiple of the market's tick when multiplied out
                  type: string
                  pattern: '^[0-9]+(\.[0-9]{1,6})?$'
                  maxLength: 24
      responses:
        "202":
          description: queued for the executor
          headers:
            x-request-id: {$ref: "#/components/headers/xRequestId"}
            x-risk-latency-ms:
              description: gate latency, on success AND on denial — the only way to see the gate getting slow
              schema: {type: string}
            x-risk-checks:
              description: how many checks ran before the verdict (denials stop early by design)
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                required: [intentId, state, notionalMicro, poll, asOf, staleAfter]
                properties:
                  intentId: {type: string}
                  state: {type: string, const: queued}
                  riskLatencyMs: {type: number}
                  notionalMicro: {type: integer, minimum: 0}
                  poll: {type: string, description: "the GET target for the intent's terminal state"}
                  note: {type: string}
        "400":
          description: missing or malformed Idempotency-Key (checked before any work)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
              example: {error: {code: IDEM_KEY_REQUIRED, message: "mutating endpoints require an Idempotency-Key of 8-128 chars [A-Za-z0-9_-]", retryable: false, requestId: 0123456789abcdef}}
        "403": {$ref: "#/components/responses/Denied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Validation"}
        # A 500 on THIS endpoint is the one status whose handling a client must not guess: it means "the write
        # may have landed", so the correct move is to retry with the SAME Idempotency-Key. That is why
        # INTERNAL is retryable and why its message says so out loud. (500 is declared on every operation
        # here, and on every operation in services/api/app.py, so the two cannot disagree silently -
        # tools/check-openapi.py compares the two sets and /healthz is the one exception, because liveness
        # has to keep answering 200 while the database is on fire.)
        "500": {$ref: "#/components/responses/Internal"}
        "429":
          description: too many open orders; retryable
          headers: {Retry-After: {schema: {type: integer, const: 2}}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: trading disabled (kill switch, stale feed, no signer, risk service down); retryable
          headers: {Retry-After: {schema: {type: integer, const: 2}}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /v1/orders/intents/{intent_id}:
    get:
      tags: [trading]
      summary: Poll one intent
      description: |
        Scoped to the caller: another user's id yields 404, not 403, so the endpoint cannot be used to probe
        which intent ids exist. `uncertain` is a legitimate, permanent-looking state — the executor refuses
        to re-POST an order whose response was lost, and says so, rather than risk a duplicate.
      operationId: getIntent
      x-auth: user
      x-rate-class: trading-read
      x-cache: no-store
      parameters:
        - name: intent_id
          in: path
          required: true
          schema: {type: string, minLength: 16, maxLength: 64}
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: current intent state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Stamped"
                  - type: object
                    required: [intentId, state]
                    properties:
                      intentId: {type: string}
                      state:
                        type: string
                        enum: [pending, rejected, queued, submitting, uncertain, submitted, cancelled]
                      riskCode: {type: ["string", "null"]}
                      venueOrderId: {type: ["string", "null"]}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/Internal"}

  /v1/admin/kill-switch:
    post:
      tags: [admin]
      summary: Engage or disengage the trading kill switch
      description: |
        Append-only history (one row per change; the current state is the newest row). A reason of 4-400
        characters is mandatory in the schema, not in a code comment, because a switch pulled without a reason
        is unreviewable. Cancelling is always permitted while engaged; placing is not — there is no endpoint
        that submits an order while the switch is on.
      operationId: killSwitch
      x-auth: admin
      x-rate-class: admin
      x-cache: no-store
      # Rule 1 ("every mutation requires Idempotency-Key") is exempted HERE, deliberately, and the exemption is
      # machine-readable because tools/check-openapi.py demands a non-empty reason for every one of them. A
      # kill switch is state-convergent: two identical POSTs make two audit rows and one outcome. Refusing to
      # ENGAGE the switch because an idempotency row was mid-flight during an incident is the worse bug.
      x-idempotency-exempt: "state-convergent toggle; duplicate rows are audit history, not money"
      parameters:
        - name: X-Admin-Token
          in: header
          required: false
          schema: {type: string}
          description: >-
            absent or empty means 503 SIGNER_UNAVAILABLE rather than a 401, so a misconfigured dev box
            cannot look like an attack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [engaged, reason]
              additionalProperties: false
              properties:
                engaged: {type: boolean}
                reason: {type: string, minLength: 4, maxLength: 400}
      responses:
        "200":
          description: new state
          content:
            application/json:
              schema:
                type: object
                required: [engaged, atMs]
                properties: {engaged: {type: boolean}, atMs: {type: integer}}
        "422":
          description: >-
            two answers, deliberately: VALIDATION when `reason` is absent (shape), BAD_REASON when it is
            present but outside 4-400 characters (the rule the DB's CHECK enforces). "Your body is wrong" and
            "say why you pulled the switch" are different advice, and the app used to collapse them.
          content:
            application/json:
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503": {$ref: "#/components/responses/Denied"}
        "500": {$ref: "#/components/responses/Internal"}

components:
  headers:
    xRequestId:
      description: echoed if sent, generated otherwise; appears on every response including errors
      schema: {type: string}

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        8-128 chars of [A-Za-z0-9_-]. Required on every mutating endpoint; the 400 for its absence is part
        of the contract so a client cannot "just try without it" once and conclude it is optional.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{8,128}$'
    UserId:
      name: X-User-Id
      in: header
      required: false
      description: |
        dev only (PGM_AUTH_MODE=dev-header). In every other deployment this is a bearer token and the user id
        comes from it; a header a client can set is not an authentication mechanism.
      schema: {type: string}

  schemas:
    Price:
      description: |
        price in (0,1) USDC as a dot-decimal string with at most 6 decimals. Strings are not a stylistic
        choice: the venue's own client types these as float (py-clob-client-v2 1.1.0), and we refuse to let
        a JSON number become the input to a money path.
      type: string
      pattern: '^0?\.\d{1,6}$|^0$'
      examples: ["0.5", "0.999", "0.001"]

    Levels:
      type: array
      minItems: 0
      maxItems: 400
      items:
        type: object
        required: [price, shares, levels]
        properties:
          price: {$ref: "#/components/schemas/Price"}
          shares: {type: string, pattern: '^[0-9]+(\.[0-9]{1,6})?$'}
          levels:
            type: integer
            minimum: 1
            description: how many venue orders sit at this price; 1 is a real answer and must render

    Fill:
      type: object
      required: [price, size, side, exchangeTs]
      properties:
        price: {$ref: "#/components/schemas/Price"}
        size: {type: string}
        side: {type: string, enum: [BUY, SELL]}
        maker: {type: boolean}
        exchangeTs: {type: integer, description: "venue clock, ms"}
        ingestMs: {type: integer, description: "our clock, ms; freshness uses THIS, never exchangeTs"}

    Market:
      type: object
      description: >-
        the fields the risk gate reads (P01 D5.2) plus what the header renders. acceptingOrders,
        secondsDelay, minimumOrderSize and enableOrderBook are required because a missing one is a different
        order-management UI, not a default.
      required: [id, question, acceptingOrders, secondsDelay, minimumTickSize, minimumOrderSize, feeType,
                 enableOrderBook]
      properties:
        id: {type: string}
        question: {type: string}
        acceptingOrders: {type: boolean}
        secondsDelay: {type: integer, minimum: 0, maximum: 600}
        minimumTickSize:
          type: string
          enum: ["0.001", "0.01"]
          description: >-
            canonical text, normalised at the boundary - Postgres NUMERIC and SQLite REAL return this column
            differently, and the gate compares strings
        minimumOrderSize: {type: string}
        feeType: {type: string, description: "open taxonomy (6 values seen in P01); no enum on purpose"}
        enableOrderBook: {type: boolean}
        endDate: {type: ["integer", "null"]}

    Stamped:
      type: object
      description: every read payload carries these three fields
      required: [asOf, staleAfter, cache]
      properties:
        asOf: {type: integer, description: "ms epoch of the data, not of the response"}
        staleAfter:
          type: integer
          description: >-
            ms epoch after which the client must mark the data stale AND stop offering to trade (design
            system D5.5: 3s tape/book, 5s price, 120s metadata)
        cache:
          type: object
          required: [ttlMs, public]
          properties:
            ttlMs: {type: integer, minimum: 0}
            key: {type: ["string", "null"]}
            public: {type: boolean}
            immutable: {type: boolean}

    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, retryable, requestId]
          additionalProperties: false
          description: >-
            no `detail` field, ever: that is where a Python message would leak. Logs carry the code and the
            request id instead.
          properties:
            code:
              type: string
              enum: [RISK_HALT, MARKET_NOT_ACCEPTING, NO_ORDER_BOOK, STALE_QUOTE, BAD_SIDE, UNKNOWN_TICK,
                     OFF_TICK, BAD_MARKET_META, BELOW_MIN_SIZE, ZERO_SIZE, BAD_AMOUNT, OVER_ORDER_CAP,
                     PRICE_FAR_FROM_MID, TOO_MANY_OPEN, DAILY_CAP, IDEM_CONFLICT, IDEM_IN_PROGRESS,
                     IDEM_KEY_REQUIRED, RISK_UNAVAILABLE, SIGNER_UNAVAILABLE, BAD_REASON, NOT_FOUND,
                     VALIDATION, INTERNAL]
            message: {type: string, description: "user-safe by construction"}
            retryable: {type: boolean}
            requestId: {type: string}

  responses:
    NotFound:
      description: no such resource
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Denied:
      description: refused by policy or by the venue feed's state
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: idempotency key reused with a different body, or a market that cannot accept orders
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Validation:
      description: request rejected before any money logic ran
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Internal:
      description: unexpected failure (logged with the request id; the body never says why)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
