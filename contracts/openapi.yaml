      description: 'The hold starts when the destination is confirmed, not when it was typed, and nothing skips it:
        the schema column that would allow the skip has a CHECK permitting only `false`, so the temptation is visible
        in the table. An address already saved by another account is recorded as an event — shared destinations are
        legitimate (an exchange deposit address) and worth noticing at the same time. '
      operationId: addAddress
