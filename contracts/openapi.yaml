  /v1/admin/revoke-sessions:
    post:
      tags:
      - admin
      summary: 'Break-glass: end every session, one statement, two named approvers'
      description: 'Two distinct approvers and a reason of at least twenty characters, validated by the same function
        the P06 kill drill uses. The single most dangerous account in this product is the one that can log everybody
        out, because that is what an attacker does to stop you from seeing what they did — so the path exists, it
