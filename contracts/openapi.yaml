  /v1/auth/totp/enroll:
    post:
      tags:
      - auth
      summary: Generate an authenticator secret, show it once, store it wrapped
      description: 'The secret is sealed under the same KEK hierarchy as the signing keys and is never cached after
        the one comparison that needs it. Enrolment is not complete until a code has been *entered*: `verified_ms`
        stays null, so a hijacked session cannot attach an attacker''s authenticator and have it mean anything. Re-enrolment
        is allowed — a lost phone is a real event — and writes an event the user sees on their next login. '
      operationId: totpEnroll
