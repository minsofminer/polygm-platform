  /v1/auth/telegram:
    post:
      tags:
      - auth
      summary: Sign in from a Telegram Mini App (initData signature, freshness, replay)
      description: 'Three checks in this order: the HMAC-SHA256 of the data-check-string under the key `HMAC-SHA256("WebAppData",
        botToken)`; `auth_date` inside five minutes for a login; then the nonce table, which is what makes a captured
        payload useless a second time. A malformed token in the environment is a 503, not a permissive fallback —
        every failure mode here is chosen so that a misconfiguration looks broken rather than open. '
      operationId: authTelegram
      x-auth: public
      x-rate-class: auth
      x-cache: no-store
      x-idempotency-exempt: 'the replay store IS the idempotency mechanism: the same payload twice is refused, not
        merged'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - initData
              properties:
                initData:
                  type: string
                  minLength: 20
                  maxLength: 8000
      responses:
