  /v1/auth/sessions:
    get:
      tags:
      - auth
      summary: This account's sessions, with no token material in any field
      description: 'The per-device list: kind, label, issued, last seen, and the reason it was revoked. Rows are safe
        to render because the tokens behind them are hashes. This is the screen a user is sent to when an alert says
        "a new device signed in", which is why it exists before the settings page does. '
      operationId: listSessions
