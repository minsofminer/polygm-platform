<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="PolyGM mark">
  <!-- Primary mark. Concept B "binary aperture":
       filled left chevron = committed position,
       outlined right chevron = open question,
       gold dot = resolution.
       Deterministic vector — the canonical production asset. -->
  <rect width="100" height="100" fill="#0c0e13"/>
  <polygon points="48,22 20,50 48,78 48,62 36,50 48,38" fill="#2e5cff"/>
  <polygon points="52,22 80,50 52,78 52,62 64,50 52,38" fill="none" stroke="#7ba5ff" stroke-width="3.5" stroke-linejoin="miter"/>
  <circle cx="50" cy="50" r="4.5" fill="#f1ce57"/>
</svg>
