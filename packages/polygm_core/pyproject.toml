[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polygm-core"
version = "0.4.0"
description = "Money, risk, ledger, executor core for Polygm. No third-party dependencies by design."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["polygm_core*"]
