name: security
# P14 D8 — continuous assurance. The five harnesses this phase built, on a schedule and on demand, plus the
# fast gates on every pull request. The point of putting them here rather than only in a person's terminal is
# that a control which stops working has to produce a red build: the alternative is a document that stays green
# because nobody re-ran it.
#
# What is deliberately *not* on the pull-request path: the 100-aggressive-users probe and the key drills. Both
# build a database and a few hundred accounts, and a five-minute PR gate that takes twenty minutes is a gate
# people learn to bypass. They run nightly and on demand, which is often enough for controls that change rarely.
"on":
  pull_request:
    paths:
      - "services/**"
      - "packages/**"
      - "tools/p14-*.py"
      - "db/**"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "41 2 * * *"        # before the nightly test job, so a security regression is the first thing seen
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: SAST + secrets + headers (pull request path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # all history: the secret scan reads every commit's added lines
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: SAST + secret history + log redaction + dependencies + IaC + containers
        run: python3 tools/p14-appsec-scan.py
      - name: the triage file still matches the code
        run: python3 tools/build-sast-triage.py /tmp/triage.json && diff -q /tmp/triage.json tools/sast-triage.json
      - name: the authorisation matrix (the phase's most important control)
        run: python3 tools/p14-authz-matrix.py
      - name: the security gate document is not stale
        run: python3 tools/p14-security-gate.py --check

  nightly:
    name: full P14 suite (drills, infra, abuse)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: SAST toolchain (ruff is the SAST engine, so the pin matters)
        run: ruff --version
      - name: every phase gate, then the security suite
        run: make security
      - name: regenerate the gate document from tonight's artifacts
        run: python3 tools/p14-security-gate.py
      - name: upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p14-evidence
          path: docs/verification/P14-*
