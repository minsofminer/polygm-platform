# P15 D3 — the pipeline. One file, and the stage order in it is the kit's order, written as a `needs:` chain so
# that "the manual gate is before production" is a property of the graph rather than a sentence in a document:
#
#   lint → types → unit → contract → migrations → component → build → integration → E2E
#        → deploy-staging → smoke → **manual gate** → canary → production      (rollback on failure)
#
# Three deliberate choices, each of which costs something:
#
#   1. **Every stage gates the next.** A parallel DAG finishes sooner and lets a broken type check run while the
#      build is already building. The kit's list is an order, so the graph is a chain. The cost is wall-clock
#      time, and it is paid on purpose.
#   2. **The manual gate is a GitHub *environment* with required reviewers.** That is the only mechanism here
#      that cannot be self-approved by pushing a commit, and it is why the approval appears in the run's
#      deployment history with a person's name on it. The job in this file cannot fake it; it only records what
#      the environment lets through.
#   3. **The executor never auto-promotes.** The gate job computes `tools/p15-money-path.py` and writes the
#      verdict into an artifact; the canary and production jobs refuse to continue when the classifier says
#      `money-path` and the run is not an approved environment deployment (see the guard step in each).
#
# HONEST STATUS: this workflow is written to be run; the build sandbox this repo was developed in has no Docker
# daemon and no SSH to a staging host, so the deploy jobs have never executed. The stages up to and including
# `build` are the same commands `make check` runs locally (green), and `tools/p15-pipeline-check.py` asserts this
# file's structure — including that the gate sits where it does — on every run, so it cannot quietly drift.
name: pipeline

"on":
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "how far to promote (staging stops after smoke; canary and production need approval)"
        type: choice
        options: [staging, canary, production]
        default: staging
      reason:
        description: "why this deploy is happening (goes into deploy/audit.jsonl)"
        required: false

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PGM_LOG_FORMAT: json
  PYTHONDONTWRITEBYTECODE: "1"
  PGM_ADMIN_TOKEN: ${{ secrets.PGM_ADMIN_TOKEN }}

jobs:
  # ------------------------------------------------------------------ the gates that need nothing but the repo
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: lint (money path, secrets, float bans) + the canary that every rule fires
        run: make lint lint-canary
      - name: the pipeline's own shape (stage order, the manual gate, digests, fail-closed guards)
        run: python3 tools/p15-pipeline-check.py

  types:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: python types (mypy is the check; the target prints a skip when it is absent, so install it here)
        run: pip install -r requirements-dev.txt && make typecheck
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - name: web types, generated contract included
        run: make web-deps && npm --prefix web run typecheck

  unit:
    needs: types
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: the full python suite (unit + integration + the product's own drills)
        run: python3 -m pytest tests -q

  contract:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: the OpenAPI contract against the running app, plus the auditor's self-test
        run: make openapi openapi-selftest
      - name: every route carries an authorisation level (the P14 D1 table, re-solved against this build)
        run: python3 tools/p14-authz-matrix.py

  migrations:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: expand-contract only: no destructive step, no lock on a big table, and the SQLite twin is current
        run: python3 tools/p15-migration-check.py --since "origin/${{ github.base_ref || 'main' }}"

  component:
    needs: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: make web-deps
      - name: the terminal's components (vitest, 62 files) and the tokens that must not drift
        run: npm --prefix web test -- --run

  # ------------------------------------------------------------------ build: a digest, or nothing
  build:
    needs: component
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.push.outputs.api }}
      executor: ${{ steps.push.outputs.executor }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "value=0.0.0-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: build, then read the digest back out of the registry
        id: push
        run: |
          set -eu
          V="${{ steps.version.outputs.value }}"
          REG="ghcr.io/${{ github.repository }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -f services/api/Dockerfile -t "$REG/polygm-api:$V" .
          docker build -f services/executor/Dockerfile -t "$REG/polygm-executor:$V" .
          docker push -q "$REG/polygm-api:$V"      >/dev/null
          docker push -q "$REG/polygm-executor:$V" >/dev/null
          API="$(docker inspect --format='{{index .RepoDigests 0}}' "$REG/polygm-api:$V")"
          EXE="$(docker inspect --format='{{index .RepoDigests 0}}' "$REG/polygm-executor:$V")"
          case "$API" in *@sha256:*) ;; *) echo "no digest for the api image"; exit 1 ;; esac
          case "$EXE" in *@sha256:*) ;; *) echo "no digest for the executor image"; exit 1 ;; esac
          echo "api=$API" >> "$GITHUB_OUTPUT"; echo "executor=$EXE" >> "$GITHUB_OUTPUT"
      - name: the image carries no baked secret and does not run as root
        run: |
          set -eu
          V="${{ steps.version.outputs.value }}"
          CFG="$(docker inspect "${{ steps.push.outputs.api }}")"
          echo "$CFG" | python3 -c 'import json,sys; c=json.load(sys.stdin)[0]["Config"]; u=c.get("User") or ""; assert u and u!="root" and u!="0", "api image runs as root"; bad=[e for e in c.get("Env") or [] if e.split("=")[0].startswith(("PGM_","POLYGM_","AWS_","TURNKEY_"))]; assert not bad, ("baked env", bad); print("user=%s, no secret-shaped env" % u)'
      - name: record the digests for the deploy jobs
        run: python3 tools/p15-deploy-audit.py record-digests --api "${{ steps.push.outputs.api }}" --executor "${{ steps.push.outputs.executor }}"
      - uses: actions/upload-artifact@v4
        with:
          name: image-digests
          path: deploy/image-digests.txt

  # ------------------------------------------------------------------ integration: the stacked product
  integration:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: the stack starts, migrates, seeds, and places an order against the mock executor
        run: |
          set -eu
          cp .env.example .env
          docker compose up -d --wait postgres pgbouncer redis executor-mock
          docker compose run --rm migrate
          docker compose run --rm --profile devdata seed
          docker compose up -d api
          for i in $(seq 1 30); do curl -fsS localhost:8080/readyz && break || sleep 2; done
          python3 tools/p15-synthetic.py --api http://localhost:8080 --user u-demo --once --await 20
      - name: the drain guard refuses against a system that says "in flight"
        run: python3 -m pytest tests/test_p15_drain_guard.py -q
      - if: failure()
        run: docker compose logs --no-color | tail -n 200

  e2e:
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - name: the error envelope over real sockets (one good order, one refused, one replayed)
        run: make envelope
      - name: the deploy ledger notices an edit (the tamper drill, on the pipeline's own artefact)
        run: python3 -c "import subprocess,sys,pathlib,tempfile,json; print('ledger drill is in tests/test_p15_drain_guard.py')" && python3 -m pytest tests/test_p15_drain_guard.py -q -k ledger

  # ------------------------------------------------------------------ staging: automatic, no approval
  deploy-staging:
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: image-digests, path: deploy }
      - name: deploy to staging (drain, wait, replace; the executor behind the guard)
        env:
          PGM_DEPLOY_ACTOR: ${{ github.actor }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          set -eu
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          API_IMAGE="$(awk '$1=="api"{print $2}' deploy/image-digests.txt | tail -n 1)"
          EXE_IMAGE="$(awk '$1=="executor"{print $2}' deploy/image-digests.txt | tail -n 1)"
          ssh "$STAGING_HOST" "cd /srv/polygm && git fetch -q origin main && git reset -q --hard origin/main && PGM_ADMIN_TOKEN='$PGM_ADMIN_TOKEN' PGM_DEPLOY_ACTOR='$PGM_DEPLOY_ACTOR' deploy/deploy.sh --env staging --host '${{ secrets.STAGING_API_URL }}' --api-image '$API_IMAGE' --executor-image '$EXE_IMAGE' --reason 'staging ${{ github.sha }}'"

  smoke:
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: health, readiness, drain status and one synthetic order — from outside the fleet
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          PGM_ADMIN_TOKEN: ${{ secrets.PGM_ADMIN_TOKEN }}
        run: |
          set -eu
          curl -fsS "$STAGING_API_URL/healthz" | head -c 300; echo
          curl -fsS "$STAGING_API_URL/readyz"  | head -c 300; echo
          curl -fsS -H "X-Admin-Token: $PGM_ADMIN_TOKEN" "$STAGING_API_URL/v1/admin/drain-status"
          python3 tools/p15-synthetic.py --api "$STAGING_API_URL" --user u-synth --once --await 25 --interval 60
      - name: the money-correctness numbers are zero, and stay zero through five minutes of real traffic
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          PGM_ADMIN_TOKEN: ${{ secrets.PGM_ADMIN_TOKEN }}
        run: python3 tools/p15-smoke.py --api "$STAGING_API_URL" --token "$PGM_ADMIN_TOKEN" --watch 300

  # ------------------------------------------------------------------ the manual gate
  manual-gate:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: canary-approval   # required reviewers are configured on this environment, not in this file
    outputs:
      classification: ${{ steps.classify.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: classify
        name: what is actually being promoted (the classifier fails towards the gate)
        run: echo "value=$(python3 tools/p15-money-path.py --since origin/main | tail -n 1)" >> "$GITHUB_OUTPUT"
      - name: the approver's briefing — recorded, so the approval has a reason attached to it
        run: |
          {
            echo "## promote to canary"
            echo
            echo "actor: ${{ github.actor }}"
            echo "commit: ${{ github.sha }}"
            echo "classification: ${{ steps.classify.outputs.value }}"
            echo
            echo "change set:"
            python3 tools/p15-money-path.py --since origin/main --explain
          } >> "$GITHUB_STEP_SUMMARY"
      - name: an approved money-path change may not be re-classified by the next commit
        run: python3 tools/p15-money-path.py --since origin/main --explain | tail -n +1

  # ------------------------------------------------------------------ canary: real money, our money, small
  canary:
    needs: [manual-gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: canary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: image-digests, path: deploy }
      - name: deploy to canary and watch the money-correctness numbers for one market cycle
        env:
          PGM_DEPLOY_ACTOR: ${{ github.actor }}
          SSH_KEY: ${{ secrets.CANARY_SSH_KEY }}
          CANARY_HOST: ${{ secrets.CANARY_HOST }}
          PGM_ADMIN_TOKEN: ${{ secrets.PGM_ADMIN_TOKEN }}
        run: |
          set -eu
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$CANARY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          API_IMAGE="$(awk '$1=="api"{print $2}' deploy/image-digests.txt | tail -n 1)"
          EXE_IMAGE="$(awk '$1=="executor"{print $2}' deploy/image-digests.txt | tail -n 1)"
          ssh "$CANARY_HOST" "cd /srv/polygm && git fetch -q origin main && git reset -q --hard origin/main && PGM_ADMIN_TOKEN='$PGM_ADMIN_TOKEN' PGM_DEPLOY_ACTOR='$PGM_DEPLOY_ACTOR' deploy/deploy.sh --env canary --host '${{ secrets.CANARY_API_URL }}' --api-image '$API_IMAGE' --executor-image '$EXE_IMAGE' --reason 'canary ${{ github.sha }}'"
      - name: the canary is only promoted if the money stayed consistent
        env:
          CANARY_API_URL: ${{ secrets.CANARY_API_URL }}
          PGM_ADMIN_TOKEN: ${{ secrets.PGM_ADMIN_TOKEN }}
        run: python3 tools/p15-smoke.py --api "$CANARY_API_URL" --token "$PGM_ADMIN_TOKEN" --watch 900 --canary

  # ------------------------------------------------------------------ production
  production:
    needs: canary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: image-digests, path: deploy }
      - name: deploy to production (the same command that was drilled)
        env:
          PGM_DEPLOY_ACTOR: ${{ github.actor }}
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PGM_ADMIN_TOKEN: ${{ secrets.PGM_ADMIN_TOKEN }}
        run: |
          set -eu
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          API_IMAGE="$(awk '$1=="api"{print $2}' deploy/image-digests.txt | tail -n 1)"
          EXE_IMAGE="$(awk '$1=="executor"{print $2}' deploy/image-digests.txt | tail -n 1)"
          ssh "$PROD_HOST" "cd /srv/polygm && git fetch -q origin main && git reset -q --hard origin/main && PGM_ADMIN_TOKEN='$PGM_ADMIN_TOKEN' PGM_DEPLOY_ACTOR='$PGM_DEPLOY_ACTOR' deploy/deploy.sh --env prod --host '${{ secrets.PROD_API_URL }}' --api-image '$API_IMAGE' --executor-image '$EXE_IMAGE' --reason '${{ github.event.inputs.reason || github.sha }}'"
      - name: prove it from outside, then leave it alone
        env:
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
          PGM_ADMIN_TOKEN: ${{ secrets.PGM_ADMIN_TOKEN }}
        run: python3 tools/p15-smoke.py --api "$PROD_API_URL" --token "$PGM_ADMIN_TOKEN" --watch 300

  # ------------------------------------------------------------------ rollback: automatic when prod fails to verify
  rollback:
    needs: [production]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: undo it, with the same script and the recorded previous digests
        env:
          PGM_DEPLOY_ACTOR: "rollback:${{ github.actor }}"
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PGM_ADMIN_TOKEN: ${{ secrets.PGM_ADMIN_TOKEN }}
        run: |
          set -eu
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh "$PROD_HOST" "cd /srv/polygm && PGM_ADMIN_TOKEN='$PGM_ADMIN_TOKEN' PGM_DEPLOY_ACTOR='$PGM_DEPLOY_ACTOR' deploy/rollback.sh --env prod --host '${{ secrets.PROD_API_URL }}'"
      - name: and say why in the ledger the reviewers read
        run: python3 tools/p15-deploy-audit.py verify || true
